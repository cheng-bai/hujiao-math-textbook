const items=[{"id":"chord-midpoint-domain","title":"弦中点轨迹：消元整线与有效开线段","goal":"用相切与相离状态区分必要条件和充分条件，解释轨迹端点为何不取。","placements":[{"label":"选择性必修第一册 2.5 曲线与方程","teacher":"x1/x1-2-5/teacher.html#x1-2-5-b5","student":"x1/x1-2-5/student.html#x1-2-5-b5"}],"html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>弦中点轨迹：消元整线与有效开线段\u003c/title>\u003cstyle>:root{--ink:#273d33;--accent:#27685c;--secondary:#346da1;--warm:#ae6036;--line:#d8ded1;--paper:#fffef8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:12px/1.6 \"PingFang SC\",\"Microsoft YaHei\",sans-serif}main{padding:10px 12px}.lab-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(180px,1fr);gap:14px}.figure{min-width:0;background:linear-gradient(140deg,#f7f9f1,#fffef8);border:1px solid var(--line);border-radius:3px;overflow:hidden}svg{display:block;width:100%;height:auto;max-height:350px}svg path,svg line{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}svg .grid{stroke:#e4e9df;stroke-width:.6}svg .axis{stroke:#9cae9e;stroke-width:1}svg .curve{stroke:var(--accent);stroke-width:2.5}svg .secondary{stroke:var(--secondary);stroke-width:2}svg .highlight{stroke:var(--warm);stroke-width:2.5}svg .aux{stroke:#829784;stroke-width:1.3}svg .dashed{stroke:#829784;stroke-width:1.3;stroke-dasharray:5 4}svg .area{fill:#d4e8dc99;stroke:var(--accent);stroke-width:1.2}svg .point{fill:var(--accent);stroke:var(--paper);stroke-width:1.3}svg text{font:12px \"PingFang SC\",sans-serif;fill:var(--ink)}svg .label{font-size:12px}svg circle.secondary{fill:var(--secondary)}svg circle.highlight{fill:var(--warm)}.formula{font-size:17px;padding:8px;background:#ecf1e6;border-left:2px solid var(--accent);overflow:auto}.formula math{max-width:100%}h3{font:600 17px/1.5 \"Songti SC\",\"STSong\",serif;margin:0 0 7px}.hint{font-size:10px;color:#6a7d68;margin:5px 8px}#metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}#metrics div{border-top:1px solid var(--line);padding:5px 0;min-width:0}small{display:block;color:#7b8875;font-size:10px}strong{font:500 14px/1.5 \"PingFang SC\",sans-serif;overflow-wrap:anywhere}#note{font-size:11px;color:#61745f;line-height:1.7}#controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}label{min-width:0;font-size:11px}label output{float:right;color:var(--accent);font-variant-numeric:tabular-nums}input[type=range]{display:block;width:100%;margin:6px 0;accent-color:var(--accent)}select{display:block;width:100%;font:11px \"PingFang SC\",sans-serif;padding:5px;background:var(--paper);border:1px solid #c5d0bf}.check{display:flex;align-items:center;gap:5px}button{font:11px \"PingFang SC\",sans-serif;padding:5px 12px;background:transparent;border:1px solid #bbcbb4;color:var(--accent);cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ae6036;outline-offset:2px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:10px;color:#788574}@media(max-width:600px){.lab-grid{grid-template-columns:1fr;gap:9px}#controls{grid-template-columns:repeat(2,minmax(0,1fr))}svg{max-height:280px}.formula{font-size:15px}#metrics{margin:7px 0}.bottom{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}\n.lab-grid>div{min-width:0}@media(max-width:600px){.lab-grid{grid-template-columns:minmax(0,1fr)}}\nmain>.formula{margin-bottom:8px}\n.lab-proof{margin-top:10px;border-top:1px solid #d8ded1;padding-top:7px}.lab-proof summary{cursor:pointer;color:#27685c;font-weight:600}.lab-proof p{margin:8px 0}.lab-proof math{max-width:100%;overflow-x:auto;padding:5px 0}\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmi>x\u003c/mi>\u003cmn>4\u003c/mn>\u003c/mfrac>\u003cmo>，\u003c/mo>\u003cmo>|\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>|\u003c/mo>\u003cmo>&lt;\u003c/mo>\u003cmfrac>\u003cmn>4\u003c/mn>\u003cmsqrt>\u003cmn>5\u003c/mn>\u003c/msqrt>\u003c/mfrac>\u003cmo>；\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsqrt>\u003cmn>5\u003c/mn>\u003c/msqrt>\u003cmi>u\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"lab-grid\">\u003cdiv class=\"figure\">\u003csvg id=\"diagram\" viewBox=\"0 0 600 360\" role=\"img\" aria-label=\"弦中点轨迹：消元整线与有效开线段\">\u003c/svg>\u003c/div>\u003cdiv>\u003cdiv id=\"metrics\" aria-live=\"polite\">\u003c/div>\u003cp id=\"note\">\u003c/p>\u003c/div>\u003c/div>\u003cdiv id=\"controls\">\u003c/div>\u003cdetails class=\"lab-proof\">\u003csummary>为什么成立 · 条件与推导\u003c/summary>\u003cdiv>\u003cp>\u003cstrong>问题入口。\u003c/strong>这里的“弦”要求椭圆上两个不同的交点。消元只给出中点必须满足的关系，尚未说明整条直线上的点都能产生这样的弦。\u003c/p>\u003cp>\u003cstrong>必要性。\u003c/strong>把直线方程代入椭圆方程，得到关于交点横坐标的一元二次方程：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmn>5\u003c/mn>\u003cmsup>\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmn>8\u003c/mn>\u003cmi>t\u003c/mi>\u003cmi>x\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>4\u003c/mn>\u003cmsup>\u003cmrow>\u003cmi>t\u003c/mi>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>−\u003c/mo>\u003cmn>4\u003c/mn>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/math>\u003cp>两个交点不同，当且仅当判别式为正：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>Δ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>16\u003c/mn>\u003cmo>(\u003c/mo>\u003cmn>5\u003c/mn>\u003cmo>−\u003c/mo>\u003cmsup>\u003cmrow>\u003cmi>t\u003c/mi>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>)\u003c/mo>\u003cmo>&gt;\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo>⇔\u003c/mo>\u003cmsup>\u003cmrow>\u003cmi>t\u003c/mi>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>&lt;\u003c/mo>\u003cmn>5\u003c/mn>\u003c/math>\u003cp>由两根和及直线方程，中点坐标为：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>M\u003c/mi>\u003cmo>(\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>4\u003c/mn>\u003cmi>t\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>5\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003cmo>,\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>t\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>5\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003cmo>)\u003c/mo>\u003c/math>\u003cp>因此，所有真实弦中点均满足：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>y\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>4\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003cmo>，\u003c/mo>\u003cmo>|\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>|\u003c/mo>\u003cmo>&lt;\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>4\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmsqrt>\u003cmn>5\u003c/mn>\u003c/msqrt>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003cp>\u003cstrong>充分性。\u003c/strong>任取满足上述条件的点，设其横坐标为：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>x\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003cmo>，\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>5\u003c/mn>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmn>0\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmn>4\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003cp>由横坐标的严格范围可知判别式为正，所以对应直线与椭圆有两个不同交点；按上面的中点公式，其横坐标正是所取横坐标，纵坐标也相同。故开线段上每一点都能成为真实弦中点，没有遗漏。\u003c/p>\u003cp>\u003cstrong>端点不取。\u003c/strong>参数为下列值时判别式为零，两交点合一，只得到切点而非非退化弦。超出此范围则无交点。\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>t\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>±\u003c/mo>\u003cmsqrt>\u003cmn>5\u003c/mn>\u003c/msqrt>\u003c/math>\u003c/div>\u003c/details>\u003cdiv class=\"bottom\">\u003cspan>改变参数，观察关系；图形取样不能替代证明。\u003c/span>\u003cbutton id=\"reset\">恢复初始状态\u003c/button>\u003c/div>\u003c/main>\u003cscript>window.LAB_SPEC={\"id\":\"chord-midpoint-domain\",\"title\":\"弦中点轨迹：消元整线与有效开线段\",\"goal\":\"用相切与相离状态区分必要条件和充分条件，解释轨迹端点为何不取。\",\"summary\":\"固定椭圆x²/4+y²=1，平行弦所在直线为y=x+t。联立得5x²+8tx+4t²−4=0，两个不同交点存在当且仅当t²\u003c5。由两根和可得弦中点M=(−4t/5,t/5)，故y=−x/4且|x|\u003c4/√5。反过来，对此开线段内任意一点，取t=−5x/4均可构造非退化弦。因此轨迹恰为开线段，而不是消元所得整条直线；t=±√5时相切，端点不取。本模块为选学探究，保留原文的双向验证。\",\"formula\":\"\u003cmath xmlns=\\\"http://www.w3.org/1998/Math/MathML\\\" display=\\\"block\\\">\u003cmi>y\u003c\\/mi>\u003cmo>=\u003c\\/mo>\u003cmo>−\u003c\\/mo>\u003cmfrac>\u003cmi>x\u003c\\/mi>\u003cmn>4\u003c\\/mn>\u003c\\/mfrac>\u003cmo>，\u003c\\/mo>\u003cmo>|\u003c\\/mo>\u003cmi>x\u003c\\/mi>\u003cmo>|\u003c\\/mo>\u003cmo>&lt;\u003c\\/mo>\u003cmfrac>\u003cmn>4\u003c\\/mn>\u003cmsqrt>\u003cmn>5\u003c\\/mn>\u003c\\/msqrt>\u003c\\/mfrac>\u003cmo>；\u003c\\/mo>\u003cmi>t\u003c\\/mi>\u003cmo>=\u003c\\/mo>\u003cmsqrt>\u003cmn>5\u003c\\/mn>\u003c\\/msqrt>\u003cmi>u\u003c\\/mi>\u003c\\/math>\",\"controls\":[{\"key\":\"u\",\"label\":\"平行线位置 u（±1为相切）\",\"type\":\"range\",\"min\":-1.4,\"max\":1.4,\"step\":0.05},{\"key\":\"candidate\",\"label\":\"显示消元得到的整条直线\",\"type\":\"checkbox\"}],\"initial\":{\"u\":0.4,\"candidate\":true},\"stateKeys\":{\"math\":[\"u\",\"candidate\"],\"view\":[],\"lesson\":[]}};\u003c/script>\u003cscript>(() => {\n  'use strict';\n  const escape = value => String(value).replace(/[&\u003c>\"']/g, ch => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch]));\n  const fmt = (value, digits = 3) => Number.isFinite(value) ? String(Number(value.toFixed(digits))) : '不适用';\n  const path = (points, cls = 'curve', close = false) => {\n    const valid = points.filter(point => point && point.every(Number.isFinite));\n    if (!valid.length) return '';\n    return `\u003cpath class=\"${escape(cls)}\" d=\"${valid.map((p, i) => (i ? 'L' : 'M') + p.map(n => n.toFixed(2)).join(',')).join(' ')}${close ? 'Z' : ''}\"/>`;\n  };\n  const line = (p, q, cls = 'aux') => path([p, q], cls);\n  const text = (x, y, value, cls = 'label') => `\u003ctext x=\"${fmt(x, 2)}\" y=\"${fmt(y, 2)}\" class=\"${escape(cls)}\">${escape(value)}\u003c/text>`;\n  const dot = (p, label = '', cls = 'point') => `\u003ccircle cx=\"${fmt(p[0], 2)}\" cy=\"${fmt(p[1], 2)}\" r=\"4\" class=\"${escape(cls)}\"/>` + (label ? text(p[0] + 7, p[1] - 8, label) : '');\n  function world(xmin, xmax, ymin, ymax) {\n    const scale = Math.min(516 / (xmax - xmin), 278 / (ymax - ymin));\n    const ox = 300 - (xmin + xmax) * scale / 2, oy = 180 + (ymin + ymax) * scale / 2;\n    const p = (x, y) => [ox + x * scale, oy - y * scale];\n    let axes = '';\n    const step = Math.pow(10, Math.floor(Math.log10(Math.max(xmax - xmin, ymax - ymin) / 7)));\n    const increment = Math.max(step, 1e-4);\n    let count = 0;\n    for (let x = Math.ceil(xmin / increment) * increment; x \u003c= xmax && count \u003c 90; x += increment, count++) axes += line(p(x, ymin), p(x, ymax), 'grid');\n    count = 0;\n    for (let y = Math.ceil(ymin / increment) * increment; y \u003c= ymax && count \u003c 90; y += increment, count++) axes += line(p(xmin, y), p(xmax, y), 'grid');\n    if (ymin \u003c= 0 && ymax >= 0) axes += line(p(xmin, 0), p(xmax, 0), 'axis') + text(...p(xmax, 0), 'x');\n    if (xmin \u003c= 0 && xmax >= 0) axes += line(p(0, ymin), p(0, ymax), 'axis') + text(...p(0, ymax), 'y');\n    if (xmin \u003c 0 && xmax > 0 && ymin \u003c 0 && ymax > 0) axes += text(ox - 14, oy + 17, 'O');\n    return {p, axes, scale};\n  }\n  function project(point, yaw = 35, elevation = 25, scale = 34, origin = [300, 190]) {\n    const a = yaw * Math.PI / 180, b = elevation * Math.PI / 180;\n    const horizontal = point[0] * Math.cos(a) - point[1] * Math.sin(a);\n    const depth = point[0] * Math.sin(a) + point[1] * Math.cos(a);\n    return [origin[0] + horizontal * scale, origin[1] - (point[2] * Math.cos(b) - depth * Math.sin(b)) * scale];\n  }\n  window.LabTools = {escape, fmt, path, line, text, dot, world, project,\n    polygon: (points, cls = 'area') => path(points, cls, true),\n    sample: (fn, from, to, count = 120) => Array.from({length: count + 1}, (_, i) => fn(from + (to - from) * i / count))};\n})();\n\u003c/script>\u003cscript>/* Independent geometry models; yaw affects projection only, never the mathematics. */\n(() => {\n  'use strict';\n  const rad = x => x * Math.PI / 180;\n  const clamp = x => Math.max(-1, Math.min(1, x));\n  const open = (L,p) => `\u003ccircle cx=\"${L.fmt(p[0],2)}\" cy=\"${L.fmt(p[1],2)}\" r=\"5\" fill=\"#fffef8\" stroke=\"#ae6036\" stroke-width=\"2\"/>`;\n  const title = (L,t,svg) => `\u003ctitle>${L.escape(t)}\u003c/title>${svg}`;\n  const experiments = {\n    'chord-midpoint-domain': {\n      model(s) {\n        const u=Number(s.u), t=Math.sqrt(5)*u, center=[-4*t/5,t/5], abs=Math.abs(u);\n        const kind=abs\u003c1-1e-12?'secant':abs\u003c=1+1e-12?'tangent':'outside';\n        const d=kind==='secant'?2/5*Math.sqrt(5-t*t):0;\n        const endpoints=kind==='secant'?[[-4*t/5-d,t/5-d],[-4*t/5+d,t/5+d]]:[];\n        return {u,t,center,kind,endpoints,valid:kind==='secant',limits:[[-4/Math.sqrt(5),1/Math.sqrt(5)],[4/Math.sqrt(5),-1/Math.sqrt(5)]],halfChord:Math.SQRT2*d};\n      },\n      render(s,L) {\n        const m=this.model(s),W=L.world(-3.2,3.2,-2.2,2.2),p=W.p;\n        let svg=W.axes+L.path(L.sample(a=>p(2*Math.cos(a),Math.sin(a)),0,2*Math.PI),'curve');\n        if(s.candidate) svg+=L.line(p(-3.2,.8),p(3.2,-.8),'dashed');\n        svg+=L.line(p(...m.limits[0]),p(...m.limits[1]),'highlight');\n        // Clip the moving infinite line to this mathematical plotting rectangle.\n        const low=Math.max(-3.2,-2.2-m.t), high=Math.min(3.2,2.2-m.t);\n        if(low\u003c=high) svg+=L.line(p(low,low+m.t),p(high,high+m.t),'secondary');\n        for(const point of m.limits) svg+=open(L,p(...point));\n        if(m.valid) svg+=L.line(p(...m.endpoints[0]),p(...m.endpoints[1]),'secondary')+L.dot(p(...m.endpoints[0]),'P')+L.dot(p(...m.endpoints[1]),'Q')+L.dot(p(...m.center),'M','highlight');\n        else if(m.kind==='tangent') svg+=open(L,p(...m.center))+L.text(350,74,'相切：P、Q合一，不是弦');\n        else svg+=L.dot(p(...m.center),'消元候选点','secondary');\n        svg+=L.text(22,25,'虚线：消元整线；实线：有效中点轨迹')+L.text(22,342,m.valid?'P、Q不同，M为真实弦中点':m.kind==='tangent'?'空心端点不取：题设要求两个不同交点':'直线与椭圆相离：候选点不是弦中点');\n        return {svg:title(L,'弦中点轨迹与范围',svg),metrics:[['参数 t / √5',L.fmt(m.u)],['交点状态',m.kind==='secant'?'两个不同交点':m.kind==='tangent'?'一个相切点':'无交点'],['弦长',m.valid?L.fmt(2*m.halfChord):'不存在非退化弦'],['候选中点坐标',`(${L.fmt(m.center[0])}, ${L.fmt(m.center[1])})`]],note:'问题：消元得到一条直线，就能取整条吗？先拖到u=±1，再比较临界位置两侧。橙色开线段表示真实弦中点，虚线只是消元的候选整线。空心端点对应相切，两交点合一，不能算作非退化弦。下方“为什么成立”分别证明必要性与充分性，并解释端点为何不取。'};\n      }\n    },\n    'line-plane-minimum-angle': {\n      model(s) {\n        const theta=Number(s.theta),phi=Number(s.phi),c=theta===90?0:Math.cos(rad(theta)),z=theta===0?0:Math.sin(rad(theta));\n        const u=[c,0,z],v=[Math.cos(rad(phi)),Math.sin(rad(phi)),0];\n        const cosine=c*Math.abs(v[0]),beta=Math.acos(clamp(cosine))*180/Math.PI;\n        return {theta,phi,u,v,cosine,beta,projection:[c,0,0],projectionDefined:theta!==90,minimum:theta,allMinimum:theta===90};\n      },\n      render(s,L) {\n        const m=this.model(s),P=q=>L.project(q,Number(s.yaw),25,43,[175,210]);\n        let svg=L.polygon([[-2.5,-2.5,0],[2.5,-2.5,0],[2.5,2.5,0],[-2.5,2.5,0]].map(P),'area');\n        const mul=(a,t)=>a.map(x=>x*t);\n        svg+=L.line(P(mul(m.u,-1.3)),P(mul(m.u,3)),'curve')+L.line(P(mul(m.v,-2.6)),P(mul(m.v,2.6)),'highlight');\n        if(m.projectionDefined){svg+=L.line(P([0,0,0]),P(mul(m.projection,3)),'secondary')+L.line(P(mul(m.projection,3)),P(mul(m.u,3)),'dashed');svg+=L.text(...P(mul(m.projection,3.25)),'射影');}\n        svg+=L.dot(P([0,0,0]),'O')+L.dot(P(mul(m.u,3)),'P')+L.text(...P(mul(m.v,2.9)),'l');\n        const graph=(phi,beta)=>[395+phi/180*180,268-beta/90*155];\n        svg+=L.line(graph(0,0),graph(180,0),'axis')+L.line(graph(0,0),graph(0,90),'axis');\n        svg+=L.path(L.sample(a=>graph(a,this.model({...s,phi:a}).beta),0,180),'highlight');\n        svg+=L.line(graph(0,m.theta),graph(180,m.theta),'dashed')+L.dot(graph(m.phi,m.beta));\n        svg+=L.text(402,87,'真实夹角 β')+L.text(374,113,'90°')+L.text(380,283,'0°')+L.text(528,283,'φ=180°')+L.text(405,313,`最低值：θ=${m.theta}°`);\n        svg+=L.text(20,24,'固定空间直线，转动平面内的直线l')+L.text(20,342,m.allMinimum?'垂直边界：射影是点，所有方向都成90°':'三维投影不保角；右图与读数给出真实夹角');\n        return {svg:title(L,'线面角为何是最小夹角',svg),metrics:[['线面角 θ',`${m.theta}°`],['平面方向 φ',`${m.phi}°`],['两直线真实夹角 β',`${L.fmt(m.beta)}°`],['最小值',`${m.minimum}°`]],note:'问题：为何用射影来衡量倾斜程度？固定空间直线，只转动平面内的l，比较右侧真实夹角曲线的最低值。再把线面角调到直角，观察射影退化后为什么所有方向都成为最小值。视角只改变屏幕投影，不改变数学读数。下方“为什么成立”用单位方向向量的数量积解释最小性与等号条件。'};\n      }\n    },\n    'ssa-circle-ray': {\n      model(s) {\n        const A=Number(s.A),b=3,h=b*Math.sin(rad(A)),d=A===90?0:b*Math.cos(rad(A));\n        const radii={height:h,equal:b,below:.95*h,above:1.05*h,long:1.2*b};\n        const a=s.mode==='explore'?h*Number(s.ratio):radii[s.mode];\n        const disc=a*a-h*h,roots=[];\n        if(disc>=-1e-10){const r=Math.sqrt(Math.max(0,disc)); roots.push(d-r);if(r>1e-10)roots.push(d+r);}\n        const candidates=roots.map(c=>({c,valid:c>1e-10,point:[c,0]}));\n        const triangles=candidates.filter(q=>q.valid).map(q=>({c:q.c,point:q.point,area:q.c*h/2,B:Math.acos(clamp((q.c-d)/a))*180/Math.PI,C:180-A-Math.acos(clamp((q.c-d)/a))*180/Math.PI}));\n        return {A,b,a,h,d,center:[d,h],disc,candidates,triangles,count:triangles.length,tangent:Math.abs(disc)\u003c1e-10,mode:s.mode};\n      },\n      render(s,L) {\n        const m=this.model(s),margin=.5,xmin=Math.min(-.5,m.d-m.a)-margin,xmax=Math.max(3,m.d+m.a)+margin,ymin=Math.min(-.5,m.h-m.a)-margin,ymax=m.h+m.a+margin;\n        const W=L.world(xmin,xmax,ymin,ymax),p=W.p;\n        let svg=L.line(p(0,0),p(xmax,0),'curve')+L.line(p(xmin,0),p(0,0),'dashed');\n        svg+=L.path(L.sample(t=>p(m.d+m.a*Math.cos(t),m.h+m.a*Math.sin(t)),0,2*Math.PI),'secondary');\n        svg+=L.line(p(0,0),p(...m.center),'curve')+L.line(p(...m.center),p(m.d,0),'dashed');\n        svg+=L.dot(p(0,0),'A')+L.dot(p(...m.center),'C');\n        for(const [i,q] of m.triangles.entries()) svg+=L.polygon([p(0,0),p(...m.center),p(...q.point)],i===0?'area':'highlight')+L.dot(p(...q.point),`B${i+1}`);\n        for(const q of m.candidates.filter(q=>!q.valid)) svg+=open(L,p(...q.point));\n        svg+=L.text(20,24,'固定AC=b=3；B必须位于正向射线上')+L.text(20,342,`有效三角形：${m.count}个；负向交点与B=A均剔除`);\n        return {svg:title(L,'SSA的圆与射线：零个、一个或两个三角形',svg),metrics:[['角 A',`${m.A}°`],['半径 a=BC',L.fmt(m.a)],['到直线的高 h',L.fmt(m.h)],['有效解数',`${m.count}个`]],note:'教师拓展：不要求全体学生背完整分类。问题：同样的两边和一个对角，为何可能有两解？先看圆与整条直线的交点，再剔除反向交点和顶点重合的候选。切换精确相切预设，比较锐角、直角与钝角；切换已知两边相等预设，观察退化交点。临界预设优先于比例滑块，返回“自由探索”后滑块生效。下方“为什么成立”给出正根判定及充分性解释。'};\n      }\n    }\n  };\n  window.TEXTBOOK_EXPERIMENTS=Object.assign(window.TEXTBOOK_EXPERIMENTS||{},experiments);\n})();\n\u003c/script>\u003cscript>(() => {\n  'use strict';\n  const spec = window.LAB_SPEC, experiment = window.TEXTBOOK_EXPERIMENTS[spec.id], L = window.LabTools;\n  let state = {...spec.initial};\n  const $ = selector => document.querySelector(selector);\n  const controls = $('#controls');\n  controls.innerHTML = spec.controls.map(control => {\n    const label = L.escape(control.label), key = L.escape(control.key);\n    if (control.type === 'select') return `\u003clabel>${label}\u003cselect data-key=\"${key}\">${control.options.map(option => `\u003coption value=\"${L.escape(option.value)}\">${L.escape(option.label)}\u003c/option>`).join('')}\u003c/select>\u003c/label>`;\n    if (control.type === 'checkbox') return `\u003clabel class=\"check\">\u003cinput data-key=\"${key}\" type=\"checkbox\">${label}\u003c/label>`;\n    return `\u003clabel>${label}\u003coutput data-output=\"${key}\">\u003c/output>\u003cinput data-key=\"${key}\" type=\"range\" min=\"${control.min}\" max=\"${control.max}\" step=\"${control.step}\">\u003c/label>`;\n  }).join('');\n  function render() {\n    const result = experiment.render({...state}, L);\n    $('#diagram').innerHTML = result.svg;\n    $('#metrics').innerHTML = (result.metrics || []).map(([label, value]) => `\u003cdiv>\u003csmall>${L.escape(label)}\u003c/small>\u003cstrong>${L.escape(value)}\u003c/strong>\u003c/div>`).join('');\n    $('#note').textContent = result.note || '';\n    for (const control of spec.controls) {\n      const input = controls.querySelector(`[data-key=\"${control.key}\"]`);\n      if (control.type === 'checkbox') input.checked = state[control.key];\n      else input.value = state[control.key];\n      const output = controls.querySelector(`[data-output=\"${control.key}\"]`);\n      if (output) output.textContent = L.fmt(state[control.key], 4);\n    }\n    window.__textbookLab = {id: spec.id, state: {...state}, model: experiment.model({...state})};\n  }\n  controls.addEventListener('input', event => {\n    const input = event.target, control = spec.controls.find(item => item.key === input.dataset.key);\n    if (!control) return;\n    state[control.key] = control.type === 'checkbox' ? input.checked\n      : control.type === 'select' ? control.options.find(option => String(option.value) === input.value).value : Number(input.value);\n    render();\n  });\n  $('#reset').addEventListener('click', () => {state = {...spec.initial}; render();});\n  function validState(next) {\n    return next && typeof next === 'object' && Object.keys(next).length === spec.controls.length && spec.controls.every(c => {\n      const value = next[c.key];\n      return c.type === 'checkbox' ? typeof value === 'boolean' : c.type === 'select'\n        ? c.options.some(option => option.value === value) : Number.isFinite(value) && value >= c.min && value \u003c= c.max && Math.abs((value-c.min)/c.step-Math.round((value-c.min)/c.step)) \u003c 1e-7;\n    });\n  }\n  function restoreScene() {\n    const hash = new URLSearchParams(location.hash.slice(1)), scene = hash.get('scene'), encoded = hash.get('state');\n    if (!scene && !encoded) return;\n    state = {...spec.initial};\n    try {\n      if (scene && scene !== 'explore') throw Error('未知场景');\n      if (encoded) {\n        const overlay = JSON.parse(encoded);\n        if (!overlay || typeof overlay !== 'object' || Array.isArray(overlay) || Object.keys(overlay).some(key => !['math', 'view', 'lesson'].includes(key))) throw Error('状态分组不合法');\n        const next = {...spec.initial};\n        for (const [group, values] of Object.entries(overlay)) {\n          if (!values || typeof values !== 'object' || Array.isArray(values)) throw Error('状态分组不合法');\n          for (const [key, value] of Object.entries(values)) {\n            if (!spec.stateKeys[group].includes(key)) throw Error('未知或错组参数');\n            next[key] = value;\n          }\n        }\n        if (!validState(next)) throw Error('参数超出范围');\n        state = next;\n      }\n      render();\n    } catch (error) {\n      state = {...spec.initial}; render();\n      $('#note').textContent = error.message + '，已恢复默认探索状态。' + $('#note').textContent;\n    }\n  }\n  addEventListener('hashchange', restoreScene);\n  window.TixuPlugin = {\n    getState: () => ({...state}),\n    setState: next => {if (!validState(next)) throw Error('模块参数超出定义范围'); state = {...next}; render();},\n    pause: () => {},\n  };\n  render();\n  restoreScene();\n})();\n\u003c/script>\u003c/body>\u003c/html>"},{"id":"parameter-cubic-roots","title":"根在哪里合并：含参三次方程的临界状态","goal":"拖动水平线，解释不同实根数为什么只在极值高度发生变化，而不只是数当前屏幕上的交点。","placements":[{"label":"选择性必修第二册 5.3 导数的应用","teacher":"x2/x2-5-3/teacher.html#x2-5-3-b14","student":"x2/x2-5-3/student.html#x2-5-3-b14"}],"html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>根在哪里合并：含参三次方程的临界状态\u003c/title>\u003cstyle>:root{--ink:#273d33;--accent:#27685c;--secondary:#346da1;--warm:#ae6036;--line:#d8ded1;--paper:#fffef8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:12px/1.6 \"PingFang SC\",\"Microsoft YaHei\",sans-serif}main{padding:10px 12px}.lab-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(180px,1fr);gap:14px}.figure{min-width:0;background:linear-gradient(140deg,#f7f9f1,#fffef8);border:1px solid var(--line);border-radius:3px;overflow:hidden}svg{display:block;width:100%;height:auto;max-height:350px}svg path,svg line{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}svg .grid{stroke:#e4e9df;stroke-width:.6}svg .axis{stroke:#9cae9e;stroke-width:1}svg .curve{stroke:var(--accent);stroke-width:2.5}svg .secondary{stroke:var(--secondary);stroke-width:2}svg .highlight{stroke:var(--warm);stroke-width:2.5}svg .aux{stroke:#829784;stroke-width:1.3}svg .dashed{stroke:#829784;stroke-width:1.3;stroke-dasharray:5 4}svg .area{fill:#d4e8dc99;stroke:var(--accent);stroke-width:1.2}svg .point{fill:var(--accent);stroke:var(--paper);stroke-width:1.3}svg text{font:12px \"PingFang SC\",sans-serif;fill:var(--ink)}svg .label{font-size:12px}svg circle.secondary{fill:var(--secondary)}svg circle.highlight{fill:var(--warm)}.formula{font-size:17px;padding:8px;background:#ecf1e6;border-left:2px solid var(--accent);overflow:auto}.formula math{max-width:100%}h3{font:600 17px/1.5 \"Songti SC\",\"STSong\",serif;margin:0 0 7px}.hint{font-size:10px;color:#6a7d68;margin:5px 8px}#metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}#metrics div{border-top:1px solid var(--line);padding:5px 0;min-width:0}small{display:block;color:#7b8875;font-size:10px}strong{font:500 14px/1.5 \"PingFang SC\",sans-serif;overflow-wrap:anywhere}#note{font-size:11px;color:#61745f;line-height:1.7}#controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}label{min-width:0;font-size:11px}label output{float:right;color:var(--accent);font-variant-numeric:tabular-nums}input[type=range]{display:block;width:100%;margin:6px 0;accent-color:var(--accent)}select{display:block;width:100%;font:11px \"PingFang SC\",sans-serif;padding:5px;background:var(--paper);border:1px solid #c5d0bf}.check{display:flex;align-items:center;gap:5px}button{font:11px \"PingFang SC\",sans-serif;padding:5px 12px;background:transparent;border:1px solid #bbcbb4;color:var(--accent);cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ae6036;outline-offset:2px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:10px;color:#788574}@media(max-width:600px){.lab-grid{grid-template-columns:1fr;gap:9px}#controls{grid-template-columns:repeat(2,minmax(0,1fr))}svg{max-height:280px}.formula{font-size:15px}#metrics{margin:7px 0}.bottom{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}\n.lab-grid>div{min-width:0}@media(max-width:600px){.lab-grid{grid-template-columns:minmax(0,1fr)}}\nmain>.formula{margin-bottom:8px}\n.lab-proof{margin-top:10px;border-top:1px solid #d8ded1;padding-top:7px}.lab-proof summary{cursor:pointer;color:#27685c;font-weight:600}.lab-proof p{margin:8px 0}.lab-proof math{max-width:100%;overflow-x:auto;padding:5px 0}\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsup>\u003cmi>x\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msup>\u003cmo>−\u003c/mo>\u003cmn>3\u003c/mn>\u003cmi>x\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>a\u003c/mi>\u003cmspace width=\"1em\"/>\u003cmi>f\u003c/mi>\u003cmo>′\u003c/mo>\u003cmo>(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmn>3\u003c/mn>\u003cmo>(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>)\u003c/mo>\u003cmo>(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>)\u003c/mo>\u003c/math>\u003c/div>\u003cdiv class=\"lab-grid\">\u003cdiv class=\"figure\">\u003csvg id=\"diagram\" viewBox=\"0 0 600 360\" role=\"img\" aria-label=\"根在哪里合并：含参三次方程的临界状态\">\u003c/svg>\u003c/div>\u003cdiv>\u003cdiv id=\"metrics\" aria-live=\"polite\">\u003c/div>\u003cp id=\"note\">\u003c/p>\u003c/div>\u003c/div>\u003cdiv id=\"controls\">\u003c/div>\u003cdetails class=\"lab-proof\">\u003csummary>为什么成立 · 条件与推导\u003c/summary>\u003cdiv>\u003cp>要判断所有参数下的根数，不应逐一试算参数，而应先找出函数的单调区间。因为每个严格单调区间与同一条水平线至多相交一次，根的个数由水平线是否进入各段值域决定。\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>f\u003c/mi>\u003cmo>(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>x\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msup>\u003cmo>−\u003c/mo>\u003cmn>3\u003c/mn>\u003cmi>x\u003c/mi>\u003cmo>，\u003c/mo>\u003cmi>f\u003c/mi>\u003cmo>′\u003c/mo>\u003cmo>(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmn>3\u003c/mn>\u003cmo>(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>)\u003c/mo>\u003cmo>(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>)\u003c/mo>\u003c/math>\u003cp>导数在两个驻点外为正、两驻点之间为负。将驻点端点并入，函数在以下三段的值域分别为：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmtable columnalign=\"left left\">\u003cmtr>\u003cmtd>\u003cmo>(\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>∞\u003c/mi>\u003cmo>,\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>]\u003c/mo>\u003c/mtd>\u003cmtd>\u003cmo>→\u003c/mo>\u003cmo>(\u003c/mo>\u003cmo>−\u003c/mo>\u003cmi>∞\u003c/mi>\u003cmo>,\u003c/mo>\u003cmn>2\u003c/mn>\u003cmo>]\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd>\u003cmo>[\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>,\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>]\u003c/mo>\u003c/mtd>\u003cmtd>\u003cmo>→\u003c/mo>\u003cmo>[\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>2\u003c/mn>\u003cmo>,\u003c/mo>\u003cmn>2\u003c/mn>\u003cmo>]\u003c/mo>\u003c/mtd>\u003c/mtr>\u003cmtr>\u003cmtd>\u003cmo>[\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>,\u003c/mo>\u003cmo>+\u003c/mo>\u003cmi>∞\u003c/mi>\u003cmo>)\u003c/mo>\u003c/mtd>\u003cmtd>\u003cmo>→\u003c/mo>\u003cmo>[\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>2\u003c/mn>\u003cmo>,\u003c/mo>\u003cmo>+\u003c/mo>\u003cmi>∞\u003c/mi>\u003cmo>)\u003c/mo>\u003c/mtd>\u003c/mtr>\u003c/mtable>\u003c/math>\u003cp>函数连续，且在每段上严格单调，因此水平线高度位于该段值域时，恰有一个交点。参数严格介于两极值之间时，三段各提供一个不同根；参数等于某个极值时，相邻两段提供的是同一个驻点，不能重复算作两个不同根；参数在两极值范围外时，仅剩一个交点。临界值的因式分解为：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsup>\u003cmi>x\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msup>\u003cmo>−\u003c/mo>\u003cmn>3\u003c/mn>\u003cmi>x\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>2\u003c/mn>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmrow>\u003cmo>(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>)\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>2\u003c/mn>\u003cmo>)\u003c/mo>\u003c/math>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsup>\u003cmi>x\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msup>\u003cmo>−\u003c/mo>\u003cmn>3\u003c/mn>\u003cmi>x\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>2\u003c/mn>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmrow>\u003cmo>(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>)\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>(\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>2\u003c/mn>\u003cmo>)\u003c/mo>\u003c/math>\u003cp>平方因子说明相切处是二重根。因此临界值有两个不同实根，按实根重数计为三个。范围外只有一个实根，另外两个根不是实数。图上的根坐标为数值近似，根数分类依据上述单调性与值域，不能由屏幕采样代替。\u003c/p>\u003c/div>\u003c/details>\u003cdiv class=\"bottom\">\u003cspan>改变参数，观察关系；图形取样不能替代证明。\u003c/span>\u003cbutton id=\"reset\">恢复初始状态\u003c/button>\u003c/div>\u003c/main>\u003cscript>window.LAB_SPEC={\"id\":\"parameter-cubic-roots\",\"title\":\"根在哪里合并：含参三次方程的临界状态\",\"goal\":\"拖动水平线，解释不同实根数为什么只在极值高度发生变化，而不只是数当前屏幕上的交点。\",\"summary\":\"设 f(x)=x³−3x，则 f′(x)=3(x−1)(x+1)。因此 f 在 (−∞,−1)、(1,+∞) 上严格增，在 (−1,1) 上严格减；将驻点端点并入，考虑三段 (−∞,−1]、[−1,1]、[1,+∞)。由 f(−1)=2、f(1)=−2 及两端趋势，这三段的值域依次为 (−∞,2]、[−2,2]、[−2,+∞)。当 −2\u003ca\u003c2 时各段各有一个交点；当 a=±2 时相邻交点合并，只剩两个不同实根；|a|>2 时仅一个实根。临界值还可直接验证：x³−3x−2=(x+1)²(x−2)，x³−3x+2=(x−1)²(x+2)，相切的根均为二重根。重数不是不同交点个数；非临界状态的数值根仅作近似显示。图中的横纵单位刻度不同，不据图估计切线角度。\",\"formula\":\"\u003cmath xmlns=\\\"http://www.w3.org/1998/Math/MathML\\\" display=\\\"block\\\">\u003cmsup>\u003cmi>x\u003c\\/mi>\u003cmn>3\u003c\\/mn>\u003c\\/msup>\u003cmo>−\u003c\\/mo>\u003cmn>3\u003c\\/mn>\u003cmi>x\u003c\\/mi>\u003cmo>=\u003c\\/mo>\u003cmi>a\u003c\\/mi>\u003cmspace width=\\\"1em\\\"/>\u003cmi>f\u003c\\/mi>\u003cmo>′\u003c\\/mo>\u003cmo>(\u003c\\/mo>\u003cmi>x\u003c\\/mi>\u003cmo>)\u003c\\/mo>\u003cmo>=\u003c\\/mo>\u003cmn>3\u003c\\/mn>\u003cmo>(\u003c\\/mo>\u003cmi>x\u003c\\/mi>\u003cmo>−\u003c\\/mo>\u003cmn>1\u003c\\/mn>\u003cmo>)\u003c\\/mo>\u003cmo>(\u003c\\/mo>\u003cmi>x\u003c\\/mi>\u003cmo>+\u003c\\/mo>\u003cmn>1\u003c\\/mn>\u003cmo>)\u003c\\/mo>\u003c\\/math>\",\"controls\":[{\"key\":\"a\",\"label\":\"水平线高度 a（临界值为 −2、2）\",\"type\":\"range\",\"min\":-4,\"max\":4,\"step\":0.05},{\"key\":\"showDerivative\",\"label\":\"同时显示导函数图像\",\"type\":\"checkbox\"}],\"initial\":{\"a\":0,\"showDerivative\":false},\"stateKeys\":{\"math\":[\"a\"],\"view\":[],\"lesson\":[\"showDerivative\"]}};\u003c/script>\u003cscript>(() => {\n  'use strict';\n  const escape = value => String(value).replace(/[&\u003c>\"']/g, ch => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch]));\n  const fmt = (value, digits = 3) => Number.isFinite(value) ? String(Number(value.toFixed(digits))) : '不适用';\n  const path = (points, cls = 'curve', close = false) => {\n    const valid = points.filter(point => point && point.every(Number.isFinite));\n    if (!valid.length) return '';\n    return `\u003cpath class=\"${escape(cls)}\" d=\"${valid.map((p, i) => (i ? 'L' : 'M') + p.map(n => n.toFixed(2)).join(',')).join(' ')}${close ? 'Z' : ''}\"/>`;\n  };\n  const line = (p, q, cls = 'aux') => path([p, q], cls);\n  const text = (x, y, value, cls = 'label') => `\u003ctext x=\"${fmt(x, 2)}\" y=\"${fmt(y, 2)}\" class=\"${escape(cls)}\">${escape(value)}\u003c/text>`;\n  const dot = (p, label = '', cls = 'point') => `\u003ccircle cx=\"${fmt(p[0], 2)}\" cy=\"${fmt(p[1], 2)}\" r=\"4\" class=\"${escape(cls)}\"/>` + (label ? text(p[0] + 7, p[1] - 8, label) : '');\n  function world(xmin, xmax, ymin, ymax) {\n    const scale = Math.min(516 / (xmax - xmin), 278 / (ymax - ymin));\n    const ox = 300 - (xmin + xmax) * scale / 2, oy = 180 + (ymin + ymax) * scale / 2;\n    const p = (x, y) => [ox + x * scale, oy - y * scale];\n    let axes = '';\n    const step = Math.pow(10, Math.floor(Math.log10(Math.max(xmax - xmin, ymax - ymin) / 7)));\n    const increment = Math.max(step, 1e-4);\n    let count = 0;\n    for (let x = Math.ceil(xmin / increment) * increment; x \u003c= xmax && count \u003c 90; x += increment, count++) axes += line(p(x, ymin), p(x, ymax), 'grid');\n    count = 0;\n    for (let y = Math.ceil(ymin / increment) * increment; y \u003c= ymax && count \u003c 90; y += increment, count++) axes += line(p(xmin, y), p(xmax, y), 'grid');\n    if (ymin \u003c= 0 && ymax >= 0) axes += line(p(xmin, 0), p(xmax, 0), 'axis') + text(...p(xmax, 0), 'x');\n    if (xmin \u003c= 0 && xmax >= 0) axes += line(p(0, ymin), p(0, ymax), 'axis') + text(...p(0, ymax), 'y');\n    if (xmin \u003c 0 && xmax > 0 && ymin \u003c 0 && ymax > 0) axes += text(ox - 14, oy + 17, 'O');\n    return {p, axes, scale};\n  }\n  function project(point, yaw = 35, elevation = 25, scale = 34, origin = [300, 190]) {\n    const a = yaw * Math.PI / 180, b = elevation * Math.PI / 180;\n    const horizontal = point[0] * Math.cos(a) - point[1] * Math.sin(a);\n    const depth = point[0] * Math.sin(a) + point[1] * Math.cos(a);\n    return [origin[0] + horizontal * scale, origin[1] - (point[2] * Math.cos(b) - depth * Math.sin(b)) * scale];\n  }\n  window.LabTools = {escape, fmt, path, line, text, dot, world, project,\n    polygon: (points, cls = 'area') => path(points, cls, true),\n    sample: (fn, from, to, count = 120) => Array.from({length: count + 1}, (_, i) => fn(from + (to - from) * i / count))};\n})();\n\u003c/script>\u003cscript>(() => {\n  'use strict';\n  const pairs = repeat => Array.from({length: 6}, (_, i) => Array.from({length: 6}, (_, j) => [i + 1, j + 1])).flat().filter(([i, j]) => repeat || i !== j);\n  const key = pair => pair.slice().sort((a, b) => a - b).join('-');\n  const box = (x, y, w, h, fill, stroke = '#a6b8af') => `\u003crect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"4\" fill=\"${fill}\" stroke=\"${stroke}\"/>`;\n  const defs = {\n    'parameter-cubic-roots': {\n      model(s) {\n        const a = Number(s.a);\n        let roots;\n        if (a === 2) roots = [{x: -1, multiplicity: 2}, {x: 2, multiplicity: 1}];\n        else if (a === -2) roots = [{x: -2, multiplicity: 1}, {x: 1, multiplicity: 2}];\n        else if (Math.abs(a) \u003c 2) {\n          const theta = Math.acos(a / 2) / 3;\n          roots = [0, 1, 2].map(k => ({x: 2 * Math.cos(theta - 2 * Math.PI * k / 3), multiplicity: 1})).sort((p, q) => p.x - q.x);\n        } else {\n          const delta = Math.sqrt(a * a / 4 - 1);\n          roots = [{x: Math.cbrt(a / 2 + delta) + Math.cbrt(a / 2 - delta), multiplicity: 1}];\n        }\n        return {a, roots, count: roots.length, realMultiplicity: roots.reduce((sum, r) => sum + r.multiplicity, 0), critical: Math.abs(a) === 2,\n          derivative: '3(x²−1)', monotonicity: ['增', '减', '增'], extrema: [[-1, 2], [1, -2]]};\n      },\n      render(s, L) {\n        const m = this.model(s), p = (x, y) => [300 + 94 * x, 177 - 25 * y], f = x => x ** 3 - 3 * x;\n        let svg = L.line(p(-2.65, 0), p(2.65, 0), 'axis') + L.line(p(0, -5), p(0, 5), 'axis');\n        for (const x of [-2, -1, 1, 2]) svg += L.text(p(x, 0)[0] - 5, 195, String(x));\n  * m.posterior, 18, '#efc8a4') + box(166 + 401 * m.posterior, 319, 401 * (1 - m.posterior), 18, '#b5cddd');\n          svg += L.text(26, 333, '只看阳性者') + L.text(166, 354, '橙：真阳性；蓝：假阳性（本条宽度按比例）');\n        } else svg += L.text(166, 333, '阳性者为空：不能计算其内部比例');\n        return {svg, metrics: [['P(阳性 | 患病)', m.conditionalDetection === null ? '未定义：患病组为空' : `${L.fmt(100 * m.sensitivity, 2)}%`], ['阳性者期望总数', count(m.positive)], ['P(患病 | 阳性)', m.posterior === null ? '未定义：阳性概率为0' : `${L.fmt(100 * m.posterior, 3)}%`], ['频数性质', '模型期望值，非实测人数']],\n          note: `这是教学模型，不是医疗建议。三个参数 p、s、q 分别是患病率、模型检出率和模型误报率；改变患病率并不会改变后两项设定，却会改变阳性者构成。反向条件的分母是真阳性与假阳性之和，而不是全体患病者。${m.posterior === null ? '当前没有阳性者，条件概率的分母为0，故不显示为0%。' : '底部只在阳性者内重新计算比例，没有把漏检和真阴性计入分母。'}${m.prevalence === 0 ? '患病组为空时，设定的检出率仍是模型参数，但P(阳性|患病)本身未定义。' : ''}${m.prevalence === 1 ? '未患病组为空，误报率仅作为模型参数，其对应条件概率未定义。' : ''}频数均是10000人模型中的期望数，可为小数，显示值保留三位；不把它们伪装成一次真实观测。贝叶斯公式作为教师选学拓展，展开“为什么成立 · 条件与推导”核对条件与分母。`};\n      }\n    }\n  };\n  window.TEXTBOOK_EXPERIMENTS = Object.assign(window.TEXTBOOK_EXPERIMENTS || {}, defs);\n})();\n\u003c/script>\u003cscript>(() => {\n  'use strict';\n  const spec = window.LAB_SPEC, experiment = window.TEXTBOOK_EXPERIMENTS[spec.id], L = window.LabTools;\n  let state = {...spec.initial};\n  const $ = selector => document.querySelector(selector);\n  const controls = $('#controls');\n  controls.innerHTML = spec.controls.map(control => {\n    const label = L.escape(control.label), key = L.escape(control.key);\n    if (control.type === 'select') return `\u003clabel>${label}\u003cselect data-key=\"${key}\">${control.options.map(option => `\u003coption value=\"${L.escape(option.value)}\">${L.escape(option.label)}\u003c/option>`).join('')}\u003c/select>\u003c/label>`;\n    if (control.type === 'checkbox') return `\u003clabel class=\"check\">\u003cinput data-key=\"${key}\" type=\"checkbox\">${label}\u003c/label>`;\n    return `\u003clabel>${label}\u003coutput data-output=\"${key}\">\u003c/output>\u003cinput data-key=\"${key}\" type=\"range\" min=\"${control.min}\" max=\"${control.max}\" step=\"${control.step}\">\u003c/label>`;\n  }).join('');\n  function render() {\n    const result = experiment.render({...state}, L);\n    $('#diagram').innerHTML = result.svg;\n    $('#metrics').innerHTML = (result.metrics || []).map(([label, value]) => `\u003cdiv>\u003csmall>${L.escape(label)}\u003c/small>\u003cstrong>${L.escape(value)}\u003c/strong>\u003c/div>`).join('');\n    $('#note').textContent = result.note || '';\n    for (const control of spec.controls) {\n      const input = controls.querySelector(`[data-key=\"${control.key}\"]`);\n      if (control.type === 'checkbox') input.checked = state[control.key];\n      else input.value = state[control.key];\n      const output = controls.querySelector(`[data-output=\"${control.key}\"]`);\n      if (output) output.textContent = L.fmt(state[control.key], 4);\n    }\n    window.__textbookLab = {id: spec.id, state: {...state}, model: experiment.model({...state})};\n  }\n  controls.addEventListener('input', event => {\n    const input = event.target, control = spec.controls.find(item => item.key === input.dataset.key);\n    if (!control) return;\n    state[control.key] = control.type === 'checkbox' ? input.checked\n      : control.type === 'select' ? control.options.find(option => String(option.value) === input.value).value : Number(input.value);\n    render();\n  });\n  $('#reset').addEventListener('click', () => {state = {...spec.initial}; render();});\n  function validState(next) {\n    return next && typeof next === 'object' && Object.keys(next).length === spec.controls.length && spec.controls.every(c => {\n      const value = next[c.key];\n      return c.type === 'checkbox' ? typeof value === 'boolean' : c.type === 'select'\n        ? c.options.some(option => option.value === value) : Number.isFinite(value) && value >= c.min && value \u003c= c.max && Math.abs((value-c.min)/c.step-Math.round((value-c.min)/c.step)) \u003c 1e-7;\n    });\n  }\n  function restoreScene() {\n    const hash = new URLSearchParams(location.hash.slice(1)), scene = hash.get('scene'), encoded = hash.get('state');\n    if (!scene && !encoded) return;\n    state = {...spec.initial};\n    try {\n      if (scene && scene !== 'explore') throw Error('未知场景');\n      if (encoded) {\n        const overlay = JSON.parse(encoded);\n        if (!overlay || typeof overlay !== 'object' || Array.isArray(overlay) || Object.keys(overlay).some(key => !['math', 'view', 'lesson'].includes(key))) throw Error('状态分组不合法');\n        const next = {...spec.initial};\n        for (const [group, values] of Object.entries(overlay)) {\n          if (!values || typeof values !== 'object' || Array.isArray(values)) throw Error('状态分组不合法');\n          for (const [key, value] of Object.entries(values)) {\n            if (!spec.stateKeys[group].includes(key)) throw Error('未知或错组参数');\n            next[key] = value;\n          }\n        }\n        if (!validState(next)) throw Error('参数超出范围');\n        state = next;\n      }\n      render();\n    } catch (error) {\n      state = {...spec.initial}; render();\n      $('#note').textContent = error.message + '，已恢复默认探索状态。' + $('#note').textContent;\n    }\n  }\n  addEventListener('hashchange', restoreScene);\n  window.TixuPlugin = {\n    getState: () => ({...state}),\n    setState: next => {if (!validState(next)) throw Error('模块参数超出定义范围'); state = {...next}; render();},\n    pause: () => {},\n  };\n  render();\n  restoreScene();\n})();\n\u003c/script>\u003c/body>\u003c/html>"},{"id":"line-plane-minimum-angle","title":"线面角：为什么与射影的夹角最小","goal":"分开视角与数学角度，观察平面内各方向对应的真实夹角及最小值。","placements":[{"label":"必修第三册 10.3 直线与平面的位置关系","teacher":"bx3/bx3-10-3/teacher.html#bx3-10-3-b26","student":"bx3/bx3-10-3/student.html#bx3-10-3-b26"},{"label":"选择性必修第一册 3.4 空间向量在立体几何中的应用","teacher":"x1/x1-3-4/teacher.html#x1-3-4-b22","student":"x1/x1-3-4/student.html#x1-3-4-b22"}],"html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>线面角：为什么与射影的夹角最小\u003c/title>\u003cstyle>:root{--ink:#273d33;--accent:#27685c;--secondary:#346da1;--warm:#ae6036;--line:#d8ded1;--paper:#fffef8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:12px/1.6 \"PingFang SC\",\"Microsoft YaHei\",sans-serif}main{padding:10px 12px}.lab-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(180px,1fr);gap:14px}.figure{min-width:0;background:linear-gradient(140deg,#f7f9f1,#fffef8);border:1px solid var(--line);border-radius:3px;overflow:hidden}svg{display:block;width:100%;height:auto;max-height:350px}svg path,svg line{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}svg .grid{stroke:#e4e9df;stroke-width:.6}svg .axis{stroke:#9cae9e;stroke-width:1}svg .curve{stroke:var(--accent);stroke-width:2.5}svg .secondary{stroke:var(--secondary);stroke-width:2}svg .highlight{stroke:var(--warm);stroke-width:2.5}svg .aux{stroke:#829784;stroke-width:1.3}svg .dashed{stroke:#829784;stroke-width:1.3;stroke-dasharray:5 4}svg .area{fill:#d4e8dc99;stroke:var(--accent);stroke-width:1.2}svg .point{fill:var(--accent);stroke:var(--paper);stroke-width:1.3}svg text{font:12px \"PingFang SC\",sans-serif;fill:var(--ink)}svg .label{font-size:12px}svg circle.secondary{fill:var(--secondary)}svg circle.highlight{fill:var(--warm)}.formula{font-size:17px;padding:8px;background:#ecf1e6;border-left:2px solid var(--accent);overflow:auto}.formula math{max-width:100%}h3{font:600 17px/1.5 \"Songti SC\",\"STSong\",serif;margin:0 0 7px}.hint{font-size:10px;color:#6a7d68;margin:5px 8px}#metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}#metrics div{border-top:1px solid var(--line);padding:5px 0;min-width:0}small{display:block;color:#7b8875;font-size:10px}strong{font:500 14px/1.5 \"PingFang SC\",sans-serif;overflow-wrap:anywhere}#note{font-size:11px;color:#61745f;line-height:1.7}#controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}label{min-width:0;font-size:11px}label output{float:right;color:var(--accent);font-variant-numeric:tabular-nums}input[type=range]{display:block;width:100%;margin:6px 0;accent-color:var(--accent)}select{display:block;width:100%;font:11px \"PingFang SC\",sans-serif;padding:5px;background:var(--paper);border:1px solid #c5d0bf}.check{display:flex;align-items:center;gap:5px}button{font:11px \"PingFang SC\",sans-serif;padding:5px 12px;background:transparent;border:1px solid #bbcbb4;color:var(--accent);cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ae6036;outline-offset:2px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:10px;color:#788574}@media(max-width:600px){.lab-grid{grid-template-columns:1fr;gap:9px}#controls{grid-template-columns:repeat(2,minmax(0,1fr))}svg{max-height:280px}.formula{font-size:15px}#metrics{margin:7px 0}.bottom{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}\n.lab-grid>div{min-width:0}@media(max-width:600px){.lab-grid{grid-template-columns:minmax(0,1fr)}}\nmain>.formula{margin-bottom:8px}\n.lab-proof{margin-top:10px;border-top:1px solid #d8ded1;padding-top:7px}.lab-proof summary{cursor:pointer;color:#27685c;font-weight:600}.lab-proof p{margin:8px 0}.lab-proof math{max-width:100%;overflow-x:auto;padding:5px 0}\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>cos\u003c/mi>\u003cmi>β\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>cos\u003c/mi>\u003cmi>θ\u003c/mi>\u003cmo>|\u003c/mo>\u003cmi>cos\u003c/mi>\u003cmi>φ\u003c/mi>\u003cmo>|\u003c/mo>\u003cmo>≤\u003c/mo>\u003cmi>cos\u003c/mi>\u003cmi>θ\u003c/mi>\u003cmo>⇒\u003c/mo>\u003cmi>β\u003c/mi>\u003cmo>≥\u003c/mo>\u003cmi>θ\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"lab-grid\">\u003cdiv class=\"figure\">\u003csvg id=\"diagram\" viewBox=\"0 0 600 360\" role=\"img\" aria-label=\"线面角：为什么与射影的夹角最小\">\u003c/svg>\u003c/div>\u003cdiv>\u003cdiv id=\"metrics\" aria-live=\"polite\">\u003c/div>\u003cp id=\"note\">\u003c/p>\u003c/div>\u003c/div>\u003cdiv id=\"controls\">\u003c/div>\u003cdetails class=\"lab-proof\">\u003csummary>为什么成立 · 条件与推导\u003c/summary>\u003cdiv>\u003cp>\u003cstrong>先分清三个角。\u003c/strong>线面角是空间直线与平面的倾斜角；方向参数描述平面内直线相对射影方向的转动；两直线夹角取不超过直角的那个角。屏幕投影不保角，不能直接量图中的夹角。\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmn>0\u003c/mn>\u003cmo>≤\u003c/mo>\u003cmi>θ\u003c/mi>\u003cmo>≤\u003c/mo>\u003cmn>90\u003c/mn>\u003cmo>°\u003c/mo>\u003cmo>，\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo>≤\u003c/mo>\u003cmi>β\u003c/mi>\u003cmo>≤\u003c/mo>\u003cmn>90\u003c/mn>\u003cmo>°\u003c/mo>\u003c/math>\u003cp>\u003cstrong>把方向写清。\u003c/strong>以平面为水平坐标面，射影方向为横轴方向。可取两个单位方向向量：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>u\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>(\u003c/mo>\u003cmi>cos\u003c/mi>\u003cmi>θ\u003c/mi>\u003cmo>,\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo>,\u003c/mo>\u003cmi>sin\u003c/mi>\u003cmi>θ\u003c/mi>\u003cmo>)\u003c/mo>\u003c/math>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>(\u003c/mo>\u003cmi>cos\u003c/mi>\u003cmi>φ\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>sin\u003c/mi>\u003cmi>φ\u003c/mi>\u003cmo>,\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo>)\u003c/mo>\u003c/math>\u003cp>\u003cstrong>为什么最小。\u003c/strong>由于讨论的是两条直线而不是两条有向射线，须对数量积取绝对值：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>cos\u003c/mi>\u003cmi>β\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>|\u003c/mo>\u003cmi>u\u003c/mi>\u003cmo>·\u003c/mo>\u003cmi>v\u003c/mi>\u003cmo>|\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi>cos\u003c/mi>\u003cmi>θ\u003c/mi>\u003cmo>|\u003c/mo>\u003cmi>cos\u003c/mi>\u003cmi>φ\u003c/mi>\u003cmo>|\u003c/mo>\u003cmo>≤\u003c/mo>\u003cmi>cos\u003c/mi>\u003cmi>θ\u003c/mi>\u003c/math>\u003cp>余弦函数在零度到九十度上严格递减，所以：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>β\u003c/mi>\u003cmo>≥\u003c/mo>\u003cmi>θ\u003c/mi>\u003c/math>\u003cp>\u003cstrong>等号与边界。\u003c/strong>线面角小于直角时，等号当且仅当平面内直线沿射影所在直线的方向。线面角等于直角时，射影退化成点，不再有射影直线；此时空间直线与平面内所有方向都垂直，所有夹角均为直角。本模型线面角为零时，空间直线位于平面内，与重合方向的直线夹角按零度处理。\u003c/p>\u003c/div>\u003c/details>\u003cdiv class=\"bottom\">\u003cspan>改变参数，观察关系；图形取样不能替代证明。\u003c/span>\u003cbutton id=\"reset\">恢复初始状态\u003c/button>\u003c/div>\u003c/main>\u003cscript>window.LAB_SPEC={\"id\":\"line-plane-minimum-angle\",\"title\":\"线面角：为什么与射影的夹角最小\",\"goal\":\"分开视角与数学角度，观察平面内各方向对应的真实夹角及最小值。\",\"summary\":\"设直线单位方向u=(cosθ,0,sinθ)，平面内单位方向v=(cosφ,sinφ,0)。两直线夹角β取0°至90°，则cosβ=|u·v|=cosθ|cosφ|≤cosθ，故β≥θ。θ\u003c90°时沿射影方向等号成立；θ=90°时射影为点，所有平面方向均与直线垂直。θ=0°时本模型中直线在平面内。三维图是正交投影，不保角；真实读数与右侧变化曲线均由数量积计算。必修阶段先观察与几何解释，选修阶段联系向量证明，原文及原证明不折叠。\",\"formula\":\"\u003cmath xmlns=\\\"http://www.w3.org/1998/Math/MathML\\\" display=\\\"block\\\">\u003cmi>cos\u003c\\/mi>\u003cmi>β\u003c\\/mi>\u003cmo>=\u003c\\/mo>\u003cmi>cos\u003c\\/mi>\u003cmi>θ\u003c\\/mi>\u003cmo>|\u003c\\/mo>\u003cmi>cos\u003c\\/mi>\u003cmi>φ\u003c\\/mi>\u003cmo>|\u003c\\/mo>\u003cmo>≤\u003c\\/mo>\u003cmi>cos\u003c\\/mi>\u003cmi>θ\u003c\\/mi>\u003cmo>⇒\u003c\\/mo>\u003cmi>β\u003c\\/mi>\u003cmo>≥\u003c\\/mo>\u003cmi>θ\u003c\\/mi>\u003c\\/math>\",\"controls\":[{\"key\":\"theta\",\"label\":\"线面角 θ（含0°与90°）\",\"type\":\"range\",\"min\":0,\"max\":90,\"step\":5},{\"key\":\"phi\",\"label\":\"平面内直线方向 φ\",\"type\":\"range\",\"min\":0,\"max\":180,\"step\":5},{\"key\":\"yaw\",\"label\":\"仅改变观察视角\",\"type\":\"range\",\"min\":0,\"max\":180,\"step\":5}],\"initial\":{\"theta\":35,\"phi\":50,\"yaw\":35},\"stateKeys\":{\"math\":[\"theta\",\"phi\"],\"view\":[\"yaw\"],\"lesson\":[]}};\u003c/script>\u003cscript>(() => {\n  'use strict';\n  const escape = value => String(value).replace(/[&\u003c>\"']/g, ch => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch]));\n  const fmt = (value, digits = 3) => Number.isFinite(value) ? String(Number(value.toFixed(digits))) : '不适用';\n  const path = (points, cls = 'curve', close = false) => {\n    const valid = points.filter(point => point && point.every(Number.isFinite));\n    if (!valid.length) return '';\n    return `\u003cpath class=\"${escape(cls)}\" d=\"${valid.map((p, i) => (i ? 'L' : 'M') + p.map(n => n.toFixed(2)).join(',')).join(' ')}${close ? 'Z' : ''}\"/>`;\n  };\n  const line = (p, q, cls = 'aux') => path([p, q], cls);\n  const text = (x, y, value, cls = 'label') => `\u003ctext x=\"${fmt(x, 2)}\" y=\"${fmt(y, 2)}\" class=\"${escape(cls)}\">${escape(value)}\u003c/text>`;\n  const dot = (p, label = '', cls = 'point') => `\u003ccircle cx=\"${fmt(p[0], 2)}\" cy=\"${fmt(p[1], 2)}\" r=\"4\" class=\"${escape(cls)}\"/>` + (label ? text(p[0] + 7, p[1] - 8, label) : '');\n  function world(xmin, xmax, ymin, ymax) {\n    const scale = Math.min(516 / (xmax - xmin), 278 / (ymax - ymin));\n    const ox = 300 - (xmin + xmax) * scale / 2, oy = 180 + (ymin + ymax) * scale / 2;\n    const p = (x, y) => [ox + x * scale, oy - y * scale];\n    let axes = '';\n    const step = Math.pow(10, Math.floor(Math.log10(Math.max(xmax - xmin, ymax - ymin) / 7)));\n    const increment = Math.max(step, 1e-4);\n    let count = 0;\n    for (let x = Math.ceil(xmin / increment) * increment; x \u003c= xmax && count \u003c 90; x += increment, count++) axes += line(p(x, ymin), p(x, ymax), 'grid');\n    count = 0;\n    for (let y = Math.ceil(ymin / increment) * increment; y \u003c= ymax && count \u003c 90; y += increment, count++) axes += line(p(xmin, y), p(xmax, y), 'grid');\n    if (ymin \u003c= 0 && ymax >= 0) axes += line(p(xmin, 0), p(xmax, 0), 'axis') + text(...p(xmax, 0), 'x');\n    if (xmin \u003c= 0 && xmax >= 0) axes += line(p(0, ymin), p(0, ymax), 'axis') + text(...p(0, ymax), 'y');\n    if (xmin \u003c 0 && xmax > 0 && ymin \u003c 0 && ymax > 0) axes += text(ox - 14, oy + 17, 'O');\n    return {p, axes, scale};\n  }\n  function project(point, yaw = 35, elevation = 25, scale = 34, origin = [300, 190]) {\n    const a = yaw * Math.PI / 180, b = elevation * Math.PI / 180;\n    const horizontal = point[0] * Math.cos(a) - point[1] * Math.sin(a);\n    const depth = point[0] * Math.sin(a) + point[1] * Math.cos(a);\n    return [origin[0] + horizontal * scale, origin[1] - (point[2] * Math.cos(b) - depth * Math.sin(b)) * scale];\n  }\n  window.LabTools = {escape, fmt, path, line, text, dot, world, project,\n    polygon: (points, cls = 'area') => path(points, cls, true),\n    sample: (fn, from, to, count = 120) => Array.from({length: count + 1}, (_, i) => fn(from + (to - from) * i / count))};\n})();\n\u003c/script>\u003cscript>/* Independent geometry models; yaw affects projection only, never the mathematics. */\n(() => {\n  'use strict';\n  const rad = x => x * Math.PI / 180;\n  const clamp = x => Math.max(-1, Math.min(1, x));\n  const open = (L,p) => `\u003ccircle cx=\"${L.fmt(p[0],2)}\" cy=\"${L.fmt(p[1],2)}\" r=\"5\" fill=\"#fffef8\" stroke=\"#ae6036\" stroke-width=\"2\"/>`;\n  const title = (L,t,svg) => `\u003ctitle>${L.escape(t)}\u003c/title>${svg}`;\n  const experiments = {\n    'chord-midpoint-domain': {\n      model(s) {\n        const u=Number(s.u), t=Math.sqrt(5)*u, center=[-4*t/5,t/5], abs=Math.abs(u);\n        const kind=abs\u003c1-1e-12?'secant':abs\u003c=1+1e-12?'tangent':'outside';\n        const d=kind==='secant'?2/5*Math.sqrt(5-t*t):0;\n        const endpoints=kind==='secant'?[[-4*t/5-d,t/5-d],[-4*t/5+d,t/5+d]]:[];\n        return {u,t,center,kind,endpoints,valid:kind==='secant',limits:[[-4/Math.sqrt(5),1/Math.sqrt(5)],[4/Math.sqrt(5),-1/Math.sqrt(5)]],halfChord:Math.SQRT2*d};\n      },\n      render(s,L) {\n        const m=this.model(s),W=L.world(-3.2,3.2,-2.2,2.2),p=W.p;\n        let svg=W.axes+L.path(L.sample(a=>p(2*Math.cos(a),Math.sin(a)),0,2*Math.PI),'curve');\n        if(s.candidate) svg+=L.line(p(-3.2,.8),p(3.2,-.8),'dashed');\n        svg+=L.line(p(...m.limits[0]),p(...m.limits[1]),'highlight');\n        // Clip the moving infinite line to this mathematical plotting rectangle.\n        const low=Math.max(-3.2,-2.2-m.t), high=Math.min(3.2,2.2-m.t);\n        if(low\u003c=high) svg+=L.line(p(low,low+m.t),p(high,high+m.t),'secondary');\n        for(const point of m.limits) svg+=open(L,p(...point));\n        if(m.valid) svg+=L.line(p(...m.endpoints[0]),p(...m.endpoints[1]),'secondary')+L.dot(p(...m.endpoints[0]),'P')+L.dot(p(...m.endpoints[1]),'Q')+L.dot(p(...m.center),'M','highlight');\n        else if(m.kind==='tangent') svg+=open(L,p(...m.center))+L.text(350,74,'相切：P、Q合一，不是弦');\n        else svg+=L.dot(p(...m.center),'消元候选点','secondary');\n        svg+=L.text(22,25,'虚线：消元整线；实线：有效中点轨迹')+L.text(22,342,m.valid?'P、Q不同，M为真实弦中点':m.kind==='tangent'?'空心端点不取：题设要求两个不同交点':'直线与椭圆相离：候选点不是弦中点');\n        return {svg:title(L,'弦中点轨迹与范围',svg),metrics:[['参数 t / √5',L.fmt(m.u)],['交点状态',m.kind==='secant'?'两个不同交点':m.kind==='tangent'?'一个相切点':'无交点'],['弦长',m.valid?L.fmt(2*m.halfChord):'不存在非退化弦'],['候选中点坐标',`(${L.fmt(m.center[0])}, ${L.fmt(m.center[1])})`]],note:'问题：消元得到一条直线，就能取整条吗？先拖到u=±1，再比较临界位置两侧。橙色开线段表示真实弦中点，虚线只是消元的候选整线。空心端点对应相切，两交点合一，不能算作非退化弦。下方“为什么成立”分别证明必要性与充分性，并解释端点为何不取。'};\n      }\n    },\n    'line-plane-minimum-angle': {\n      model(s) {\n        const theta=Number(s.theta),phi=Number(s.phi),c=theta===90?0:Math.cos(rad(theta)),z=theta===0?0:Math.sin(rad(theta));\n        const u=[c,0,z],v=[Math.cos(rad(phi)),Math.sin(rad(phi)),0];\n        const cosine=c*Math.abs(v[0]),beta=Math.acos(clamp(cosine))*180/Math.PI;\n        return {theta,phi,u,v,cosine,beta,projection:[c,0,0],projectionDefined:theta!==90,minimum:theta,allMinimum:theta===90};\n      },\n      render(s,L) {\n        const m=this.model(s),P=q=>L.project(q,Number(s.yaw),25,43,[175,210]);\n        let svg=L.polygon([[-2.5,-2.5,0],[2.5,-2.5,0],[2.5,2.5,0],[-2.5,2.5,0]].map(P),'area');\n        const mul=(a,t)=>a.map(x=>x*t);\n        svg+=L.line(P(mul(m.u,-1.3)),P(mul(m.u,3)),'curve')+L.line(P(mul(m.v,-2.6)),P(mul(m.v,2.6)),'highlight');\n        if(m.projectionDefined){svg+=L.line(P([0,0,0]),P(mul(m.projection,3)),'secondary')+L.line(P(mul(m.projection,3)),P(mul(m.u,3)),'dashed');svg+=L.text(...P(mul(m.projection,3.25)),'射影');}\n        svg+=L.dot(P([0,0,0]),'O')+L.dot(P(mul(m.u,3)),'P')+L.text(...P(mul(m.v,2.9)),'l');\n        const graph=(phi,beta)=>[395+phi/180*180,268-beta/90*155];\n        svg+=L.line(graph(0,0),graph(180,0),'axis')+L.line(graph(0,0),graph(0,90),'axis');\n        svg+=L.path(L.sample(a=>graph(a,this.model({...s,phi:a}).beta),0,180),'highlight');\n        svg+=L.line(graph(0,m.theta),graph(180,m.theta),'dashed')+L.dot(graph(m.phi,m.beta));\n        svg+=L.text(402,87,'真实夹角 β')+L.text(374,113,'90°')+L.text(380,283,'0°')+L.text(528,283,'φ=180°')+L.text(405,313,`最低值：θ=${m.theta}°`);\n        svg+=L.text(20,24,'固定空间直线，转动平面内的直线l')+L.text(20,342,m.allMinimum?'垂直边界：射影是点，所有方向都成90°':'三维投影不保角；右图与读数给出真实夹角');\n        return {svg:title(L,'线面角为何是最小夹角',svg),metrics:[['线面角 θ',`${m.theta}°`],['平面方向 φ',`${m.phi}°`],['两直线真实夹角 β',`${L.fmt(m.beta)}°`],['最小值',`${m.minimum}°`]],note:'问题：为何用射影来衡量倾斜程度？固定空间直线，只转动平面内的l，比较右侧真实夹角曲线的最低值。再把线面角调到直角，观察射影退化后为什么所有方向都成为最小值。视角只改变屏幕投影，不改变数学读数。下方“为什么成立”用单位方向向量的数量积解释最小性与等号条件。'};\n      }\n    },\n    'ssa-circle-ray': {\n      model(s) {\n        const A=Number(s.A),b=3,h=b*Math.sin(rad(A)),d=A===90?0:b*Math.cos(rad(A));\n        const radii={height:h,equal:b,below:.95*h,above:1.05*h,long:1.2*b};\n        const a=s.mode==='explore'?h*Number(s.ratio):radii[s.mode];\n        const disc=a*a-h*h,roots=[];\n        if(disc>=-1e-10){const r=Math.sqrt(Math.max(0,disc)); roots.push(d-r);if(r>1e-10)roots.push(d+r);}\n        const candidates=roots.map(c=>({c,valid:c>1e-10,point:[c,0]}));\n        const triangles=candidates.filter(q=>q.valid).map(q=>({c:q.c,point:q.point,area:q.c*h/2,B:Math.acos(clamp((q.c-d)/a))*180/Math.PI,C:180-A-Math.acos(clamp((q.c-d)/a))*180/Math.PI}));\n        return {A,b,a,h,d,center:[d,h],disc,candidates,triangles,count:triangles.length,tangent:Math.abs(disc)\u003c1e-10,mode:s.mode};\n      },\n      render(s,L) {\n        const m=this.model(s),margin=.5,xmin=Math.min(-.5,m.d-m.a)-margin,xmax=Math.max(3,m.d+m.a)+margin,ymin=Math.min(-.5,m.h-m.a)-margin,ymax=m.h+m.a+margin;\n        const W=L.world(xmin,xmax,ymin,ymax),p=W.p;\n        let svg=L.line(p(0,0),p(xmax,0),'curve')+L.line(p(xmin,0),p(0,0),'dashed');\n        svg+=L.path(L.sample(t=>p(m.d+m.a*Math.cos(t),m.h+m.a*Math.sin(t)),0,2*Math.PI),'secondary');\n        svg+=L.line(p(0,0),p(...m.center),'curve')+L.line(p(...m.center),p(m.d,0),'dashed');\n        svg+=L.dot(p(0,0),'A')+L.dot(p(...m.center),'C');\n        for(const [i,q] of m.triangles.entries()) svg+=L.polygon([p(0,0),p(...m.center),p(...q.point)],i===0?'area':'highlight')+L.dot(p(...q.point),`B${i+1}`);\n        for(const q of m.candidates.filter(q=>!q.valid)) svg+=open(L,p(...q.point));\n        svg+=L.text(20,24,'固定AC=b=3；B必须位于正向射线上')+L.text(20,342,`有效三角形：${m.count}个；负向交点与B=A均剔除`);\n        return {svg:title(L,'SSA的圆与射线：零个、一个或两个三角形',svg),metrics:[['角 A',`${m.A}°`],['半径 a=BC',L.fmt(m.a)],['到直线的高 h',L.fmt(m.h)],['有效解数',`${m.count}个`]],note:'教师拓展：不要求全体学生背完整分类。问题：同样的两边和一个对角，为何可能有两解？先看圆与整条直线的交点，再剔除反向交点和顶点重合的候选。切换精确相切预设，比较锐角、直角与钝角；切换已知两边相等预设，观察退化交点。临界预设优先于比例滑块，返回“自由探索”后滑块生效。下方“为什么成立”给出正根判定及充分性解释。'};\n      }\n    }\n  };\n  window.TEXTBOOK_EXPERIMENTS=Object.assign(window.TEXTBOOK_EXPERIMENTS||{},experiments);\n})();\n\u003c/script>\u003cscript>(() => {\n  'use strict';\n  const spec = window.LAB_SPEC, experiment = window.TEXTBOOK_EXPERIMENTS[spec.id], L = window.LabTools;\n  let state = {...spec.initial};\n  const $ = selector => document.querySelector(selector);\n  const controls = $('#controls');\n  controls.innerHTML = spec.controls.map(control => {\n    const label = L.escape(control.label), key = L.escape(control.key);\n    if (control.type === 'select') return `\u003clabel>${label}\u003cselect data-key=\"${key}\">${control.options.map(option => `\u003coption value=\"${L.escape(option.value)}\">${L.escape(option.label)}\u003c/option>`).join('')}\u003c/select>\u003c/label>`;\n    if (control.type === 'checkbox') return `\u003clabel class=\"check\">\u003cinput data-key=\"${key}\" type=\"checkbox\">${label}\u003c/label>`;\n    return `\u003clabel>${label}\u003coutput data-output=\"${key}\">\u003c/output>\u003cinput data-key=\"${key}\" type=\"range\" min=\"${control.min}\" max=\"${control.max}\" step=\"${control.step}\">\u003c/label>`;\n  }).join('');\n  function render() {\n    const result = experiment.render({...state}, L);\n    $('#diagram').innerHTML = result.svg;\n    $('#metrics').innerHTML = (result.metrics || []).map(([label, value]) => `\u003cdiv>\u003csmall>${L.escape(label)}\u003c/small>\u003cstrong>${L.escape(value)}\u003c/strong>\u003c/div>`).join('');\n    $('#note').textContent = result.note || '';\n    for (const control of spec.controls) {\n      const input = controls.querySelector(`[data-key=\"${control.key}\"]`);\n      if (control.type === 'checkbox') input.checked = state[control.key];\n      else input.value = state[control.key];\n      const output = controls.querySelector(`[data-output=\"${control.key}\"]`);\n      if (output) output.textContent = L.fmt(state[control.key], 4);\n    }\n    window.__textbookLab = {id: spec.id, state: {...state}, model: experiment.model({...state})};\n  }\n  controls.addEventListener('input', event => {\n    const input = event.target, control = spec.controls.find(item => item.key === input.dataset.key);\n    if (!control) return;\n    state[control.key] = control.type === 'checkbox' ? input.checked\n      : control.type === 'select' ? control.options.find(option => String(option.value) === input.value).value : Number(input.value);\n    render();\n  });\n  $('#reset').addEventListener('click', () => {state = {...spec.initial}; render();});\n  function validState(next) {\n    return next && typeof next === 'object' && Object.keys(next).length === spec.controls.length && spec.controls.every(c => {\n      const value = next[c.key];\n      return c.type === 'checkbox' ? typeof value === 'boolean' : c.type === 'select'\n        ? c.options.some(option => option.value === value) : Number.isFinite(value) && value >= c.min && value \u003c= c.max && Math.abs((value-c.min)/c.step-Math.round((value-c.min)/c.step)) \u003c 1e-7;\n    });\n  }\n  function restoreScene() {\n    const hash = new URLSearchParams(location.hash.slice(1)), scene = hash.get('scene'), encoded = hash.get('state');\n    if (!scene && !encoded) return;\n    state = {...spec.initial};\n    try {\n      if (scene && scene !== 'explore') throw Error('未知场景');\n      if (encoded) {\n        const overlay = JSON.parse(encoded);\n        if (!overlay || typeof overlay !== 'object' || Array.isArray(overlay) || Object.keys(overlay).some(key => !['math', 'view', 'lesson'].includes(key))) throw Error('状态分组不合法');\n        const next = {...spec.initial};\n        for (const [group, values] of Object.entries(overlay)) {\n          if (!values || typeof values !== 'object' || Array.isArray(values)) throw Error('状态分组不合法');\n          for (const [key, value] of Object.entries(values)) {\n            if (!spec.stateKeys[group].includes(key)) throw Error('未知或错组参数');\n            next[key] = value;\n          }\n        }\n        if (!validState(next)) throw Error('参数超出范围');\n        state = next;\n      }\n      render();\n    } catch (error) {\n      state = {...spec.initial}; render();\n      $('#note').textContent = error.message + '，已恢复默认探索状态。' + $('#note').textContent;\n    }\n  }\n  addEventListener('hashchange', restoreScene);\n  window.TixuPlugin = {\n    getState: () => ({...state}),\n    setState: next => {if (!validState(next)) throw Error('模块参数超出定义范围'); state = {...next}; render();},\n    pause: () => {},\n  };\n  render();\n  restoreScene();\n})();\n\u003c/script>\u003c/body>\u003c/html>"},{"id":"counting-equal-multiplicity","title":"为什么能除以重复次数：从有序过程到最终结果","goal":"选择一个最终结果，反查它对应的全部有序过程；比较统一重复与不统一重复，判断何时可以整体相除。","placements":[{"label":"选择性必修第二册 6.3 组合","teacher":"x2/x2-6-3/teacher.html#x2-6-3-b10","student":"x2/x2-6-3/student.html#x2-6-3-b10"}],"html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>为什么能除以重复次数：从有序过程到最终结果\u003c/title>\u003cstyle>:root{--ink:#273d33;--accent:#27685c;--secondary:#346da1;--warm:#ae6036;--line:#d8ded1;--paper:#fffef8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:12px/1.6 \"PingFang SC\",\"Microsoft YaHei\",sans-serif}main{padding:10px 12px}.lab-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(180px,1fr);gap:14px}.figure{min-width:0;background:linear-gradient(140deg,#f7f9f1,#fffef8);border:1px solid var(--line);border-radius:3px;overflow:hidden}svg{display:block;width:100%;height:auto;max-height:350px}svg path,svg line{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}svg .grid{stroke:#e4e9df;stroke-width:.6}svg .axis{stroke:#9cae9e;stroke-width:1}svg .curve{stroke:var(--accent);stroke-width:2.5}svg .secondary{stroke:var(--secondary);stroke-width:2}svg .highlight{stroke:var(--warm);stroke-width:2.5}svg .aux{stroke:#829784;stroke-width:1.3}svg .dashed{stroke:#829784;stroke-width:1.3;stroke-dasharray:5 4}svg .area{fill:#d4e8dc99;stroke:var(--accent);stroke-width:1.2}svg .point{fill:var(--accent);stroke:var(--paper);stroke-width:1.3}svg text{font:12px \"PingFang SC\",sans-serif;fill:var(--ink)}svg .label{font-size:12px}svg circle.secondary{fill:var(--secondary)}svg circle.highlight{fill:var(--warm)}.formula{font-size:17px;padding:8px;background:#ecf1e6;border-left:2px solid var(--accent);overflow:auto}.formula math{max-width:100%}h3{font:600 17px/1.5 \"Songti SC\",\"STSong\",serif;margin:0 0 7px}.hint{font-size:10px;color:#6a7d68;margin:5px 8px}#metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}#metrics div{border-top:1px solid var(--line);padding:5px 0;min-width:0}small{display:block;color:#7b8875;font-size:10px}strong{font:500 14px/1.5 \"PingFang SC\",sans-serif;overflow-wrap:anywhere}#note{font-size:11px;color:#61745f;line-height:1.7}#controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}label{min-width:0;font-size:11px}label output{float:right;color:var(--accent);font-variant-numeric:tabular-nums}input[type=range]{display:block;width:100%;margin:6px 0;accent-color:var(--accent)}select{display:block;width:100%;font:11px \"PingFang SC\",sans-serif;padding:5px;background:var(--paper);border:1px solid #c5d0bf}.check{display:flex;align-items:center;gap:5px}button{font:11px \"PingFang SC\",sans-serif;padding:5px 12px;background:transparent;border:1px solid #bbcbb4;color:var(--accent);cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ae6036;outline-offset:2px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:10px;color:#788574}@media(max-width:600px){.lab-grid{grid-template-columns:1fr;gap:9px}#controls{grid-template-columns:repeat(2,minmax(0,1fr))}svg{max-height:280px}.formula{font-size:15px}#metrics{margin:7px 0}.bottom{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}\n.lab-grid>div{min-width:0}@media(max-width:600px){.lab-grid{grid-template-columns:minmax(0,1fr)}}\nmain>.formula{margin-bottom:8px}\n.lab-proof{margin-top:10px;border-top:1px solid #d8ded1;padding-top:7px}.lab-proof summary{cursor:pointer;color:#27685c;font-weight:600}.lab-proof p{margin:8px 0}.lab-proof math{max-width:100%;overflow-x:auto;padding:5px 0}\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsubsup>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmn>6\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>6\u003c/mn>\u003cmo>×\u003c/mo>\u003cmn>5\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmo>!\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmn>15\u003c/mn>\u003cmspace width=\"1em\"/>\u003cmn>36\u003c/mn>\u003cmo>=\u003c/mo>\u003cmn>6\u003c/mn>\u003cmo>×\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmn>15\u003c/mn>\u003cmo>×\u003c/mo>\u003cmn>2\u003c/mn>\u003c/math>\u003c/div>\u003cdiv class=\"lab-grid\">\u003cdiv class=\"figure\">\u003csvg id=\"diagram\" viewBox=\"0 0 600 360\" role=\"img\" aria-label=\"为什么能除以重复次数：从有序过程到最终结果\">\u003c/svg>\u003c/div>\u003cdiv>\u003cdiv id=\"metrics\" aria-live=\"polite\">\u003c/div>\u003cp id=\"note\">\u003c/p>\u003c/div>\u003c/div>\u003cdiv id=\"controls\">\u003c/div>\u003cdetails class=\"lab-proof\">\u003csummary>为什么成立 · 条件与推导\u003c/summary>\u003cdiv>\u003cp>先问一个最终结果对应多少个有序生成过程，再判断这个数对所有最终结果是否一致。只有重复次数一致时，才可用有序结果总数统一相除。\u003c/p>\u003cp>从六个不同元素中不放回取两个。第一步有六种选择，第二步有五种选择，共三十个有序过程。对每组不同元素，两种次序都存在，且恰有这两种，因此：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmo>{\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo>}\u003c/mo>\u003cmo>↔\u003c/mo>\u003cmo>(\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo>)\u003c/mo>\u003cmo>、\u003c/mo>\u003cmo>(\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>)\u003c/mo>\u003cmo>，\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>≠\u003c/mo>\u003cmi>j\u003c/mi>\u003c/math>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsubsup>\u003cmi mathvariant=\"normal\">C\u003c/mi>\u003cmn>6\u003c/mn>\u003cmn>2\u003c/mn>\u003c/msubsup>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>6\u003c/mn>\u003cmo>×\u003c/mo>\u003cmn>5\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmo>!\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmn>15\u003c/mn>\u003c/math>\u003cp>换成两枚可区分的公平骰子独立投掷，有三十六个等可能有序结果。忽略顺序后，同点数组只有一种来源，异点数组有两种来源。六组同点数与十五组异点数共同组成二十一组，但被计次数并不统一：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmn>36\u003c/mn>\u003cmo>=\u003c/mo>\u003cmn>6\u003c/mn>\u003cmo>×\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>+\u003c/mo>\u003cmn>15\u003c/mn>\u003cmo>×\u003c/mo>\u003cmn>2\u003c/mn>\u003cmo>，\u003c/mo>\u003cmn>21\u003c/mn>\u003cmo>=\u003c/mo>\u003cmn>6\u003c/mn>\u003cmo>+\u003c/mo>\u003cmn>15\u003c/mn>\u003c/math>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>(\u003c/mo>\u003cmo>{\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>}\u003c/mo>\u003cmo>)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmn>36\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003cmo>，\u003c/mo>\u003cmi>P\u003c/mi>\u003cmo>(\u003c/mo>\u003cmo>{\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo>}\u003c/mo>\u003cmo>)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>2\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmn>36\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003cmo>，\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo>≠\u003c/mo>\u003cmi>j\u003c/mi>\u003c/math>\u003cp>因此不能用三十六统一除以二，也不能对无序结果直接使用“有利组数除以二十一”。这里最终结果写作无序对，花括号仅表示忽略顺序，不把同点数的两次出现删除。第一种场景选中同项时结果不存在，切换到骰子场景后才有效。左栏高亮逐一展示当前最终结果的全部来源。\u003c/p>\u003c/div>\u003c/details>\u003cdiv class=\"bottom\">\u003cspan>改变参数，观察关系；图形取样不能替代证明。\u003c/span>\u003cbutton id=\"reset\">恢复初始状态\u003c/button>\u003c/div>\u003c/main>\u003cscript>window.LAB_SPEC={\"id\":\"counting-equal-multiplicity\",\"title\":\"为什么能除以重复次数：从有序过程到最终结果\",\"goal\":\"选择一个最终结果，反查它对应的全部有序过程；比较统一重复与不统一重复，判断何时可以整体相除。\",\"summary\":\"场景一：从1至6六个不同元素中依次等可能地不放回取两个，共6×5=30个有序结果。忽略顺序后，每组{i,j}（i≠j）恰对应(i,j)、(j,i)，故共30÷2=15组。场景二：两枚可区分的公平骰子独立投掷，36个有序结果等可能；忽略顺序后，同点数组各有1个来源，异点数组各有2个来源，共6+15=21组。因此不能统一用36÷2计数，更不能把21个无序结果视为等可能：同点数组概率1/36，异点数组概率2/36。这里统一相除的依据是每个最终结果被计次数相同。选取重复项在不放回场景中无效，界面诚实保留该选择并标明结果不存在。\",\"formula\":\"\u003cmath xmlns=\\\"http://www.w3.org/1998/Math/MathML\\\" display=\\\"block\\\">\u003cmsubsup>\u003cmi mathvariant=\\\"normal\\\">C\u003c\\/mi>\u003cmn>6\u003c\\/mn>\u003cmn>2\u003c\\/mn>\u003c\\/msubsup>\u003cmo>=\u003c\\/mo>\u003cmfrac>\u003cmrow>\u003cmn>6\u003c\\/mn>\u003cmo>×\u003c\\/mo>\u003cmn>5\u003c\\/mn>\u003c\\/mrow>\u003cmrow>\u003cmn>2\u003c\\/mn>\u003cmo>!\u003c\\/mo>\u003c\\/mrow>\u003c\\/mfrac>\u003cmo>=\u003c\\/mo>\u003cmn>15\u003c\\/mn>\u003cmspace width=\\\"1em\\\"/>\u003cmn>36\u003c\\/mn>\u003cmo>=\u003c\\/mo>\u003cmn>6\u003c\\/mn>\u003cmo>×\u003c\\/mo>\u003cmn>1\u003c\\/mn>\u003cmo>+\u003c\\/mo>\u003cmn>15\u003c\\/mn>\u003cmo>×\u003c\\/mo>\u003cmn>2\u003c\\/mn>\u003c\\/math>\",\"controls\":[{\"key\":\"scenario\",\"label\":\"生成过程\",\"type\":\"select\",\"options\":[{\"value\":\"distinct\",\"label\":\"六个不同元素取2，不放回\"},{\"value\":\"dice\",\"label\":\"两枚公平骰子，允许同点数\"}]},{\"key\":\"result\",\"label\":\"选择最终结果，反查有序来源\",\"type\":\"select\",\"options\":[{\"value\":\"1-1\",\"label\":\"{1,1}（同项仅骰子有效）\"},{\"value\":\"1-2\",\"label\":\"{1,2}\"},{\"value\":\"1-3\",\"label\":\"{1,3}\"},{\"value\":\"1-4\",\"label\":\"{1,4}\"},{\"value\":\"1-5\",\"label\":\"{1,5}\"},{\"value\":\"1-6\",\"label\":\"{1,6}\"},{\"value\":\"2-2\",\"label\":\"{2,2}（同项仅骰子有效）\"},{\"value\":\"2-3\",\"label\":\"{2,3}\"},{\"value\":\"2-4\",\"label\":\"{2,4}\"},{\"value\":\"2-5\",\"label\":\"{2,5}\"},{\"value\":\"2-6\",\"label\":\"{2,6}\"},{\"value\":\"3-3\",\"label\":\"{3,3}（同项仅骰子有效）\"},{\"value\":\"3-4\",\"label\":\"{3,4}\"},{\"value\":\"3-5\",\"label\":\"{3,5}\"},{\"value\":\"3-6\",\"label\":\"{3,6}\"},{\"value\":\"4-4\",\"label\":\"{4,4}（同项仅骰子有效）\"},{\"value\":\"4-5\",\"label\":\"{4,5}\"},{\"value\":\"4-6\",\"label\":\"{4,6}\"},{\"value\":\"5-5\",\"label\":\"{5,5}（同项仅骰子有效）\"},{\"value\":\"5-6\",\"label\":\"{5,6}\"},{\"value\":\"6-6\",\"label\":\"{6,6}（同项仅骰子有效）\"}]}],\"initial\":{\"scenario\":\"distinct\",\"result\":\"1-2\"},\"stateKeys\":{\"math\":[\"scenario\",\"result\"],\"view\":[],\"lesson\":[]}};\u003c/script>\u003cscript>(() => {\n  'use strict';\n  const escape = value => String(value).replace(/[&\u003c>\"']/g, ch => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch]));\n  const fmt = (value, digits = 3) => Number.isFinite(value) ? String(Number(value.toFixed(digits))) : '不适用';\n  const path = (points, cls = 'curve', close = false) => {\n    const valid = points.filter(point => point && point.every(Number.isFinite));\n    if (!valid.length) return '';\n    return `\u003cpath class=\"${escape(cls)}\" d=\"${valid.map((p, i) => (i ? 'L' : 'M') + p.map(n => n.toFixed(2)).join(',')).join(' ')}${close ? 'Z' : ''}\"/>`;\n  };\n  const line = (p, q, cls = 'aux') => path([p, q], cls);\n  const text = (x, y, value, cls = 'label') => `\u003ctext x=\"${fmt(x, 2)}\" y=\"${fmt(y, 2)}\" class=\"${escape(cls)}\">${escape(value)}\u003c/text>`;\n  const dot = (p, label = '', cls = 'point') => `\u003ccircle cx=\"${fmt(p[0], 2)}\" cy=\"${fmt(p[1], 2)}\" r=\"4\" class=\"${escape(cls)}\"/>` + (label ? text(p[0] + 7, p[1] - 8, label) : '');\n  function world(xmin, xmax, ymin, ymax) {\n    const scale = Math.min(516 / (xmax - xmin), 278 / (ymax - ymin));\n    const ox = 300 - (xmin + xmax) * scale / 2, oy = 180 + (ymin + ymax) * scale / 2;\n    const p = (x, y) => [ox + x * scale, oy - y * scale];\n    let axes = '';\n    const step = Math.pow(10, Math.floor(Math.log10(Math.max(xmax - xmin, ymax - ymin) / 7)));\n    const increment = Math.max(step, 1e-4);\n    let count = 0;\n    for (let x = Math.ceil(xmin / increment) * increment; x \u003c= xmax && count \u003c 90; x += increment, count++) axes += line(p(x, ymin), p(x, ymax), 'grid');\n    count = 0;\n    for (let y = Math.ceil(ymin / increment) * increment; y \u003c= ymax && count \u003c 90; y += increment, count++)
