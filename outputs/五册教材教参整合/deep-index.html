d], L = window.LabTools;\n  let state = {...spec.initial};\n  const $ = selector => document.querySelector(selector);\n  const controls = $('#controls');\n  controls.innerHTML = spec.controls.map(control => {\n    const label = L.escape(control.label), key = L.escape(control.key);\n    if (control.type === 'select') return `\u003clabel>${label}\u003cselect data-key=\"${key}\">${control.options.map(option => `\u003coption value=\"${L.escape(option.value)}\">${L.escape(option.label)}\u003c/option>`).join('')}\u003c/select>\u003c/label>`;\n    if (control.type === 'checkbox') return `\u003clabel class=\"check\">\u003cinput data-key=\"${key}\" type=\"checkbox\">${label}\u003c/label>`;\n    return `\u003clabel>${label}\u003coutput data-output=\"${key}\">\u003c/output>\u003cinput data-key=\"${key}\" type=\"range\" min=\"${control.min}\" max=\"${control.max}\" step=\"${control.step}\">\u003c/label>`;\n  }).join('');\n  function render() {\n    const result = experiment.render({...state}, L);\n    $('#diagram').innerHTML = result.svg;\n    $('#metrics').innerHTML = (result.metrics || []).map(([label, value]) => `\u003cdiv>\u003csmall>${L.escape(label)}\u003c/small>\u003cstrong>${L.escape(value)}\u003c/strong>\u003c/div>`).join('');\n    $('#note').textContent = result.note || '';\n    for (const control of spec.controls) {\n      const input = controls.querySelector(`[data-key=\"${control.key}\"]`);\n      if (control.type === 'checkbox') input.checked = state[control.key];\n      else input.value = state[control.key];\n      const output = controls.querySelector(`[data-output=\"${control.key}\"]`);\n      if (output) output.textContent = L.fmt(state[control.key], 4);\n    }\n    window.__textbookLab = {id: spec.id, state: {...state}, model: experiment.model({...state})};\n  }\n  controls.addEventListener('input', event => {\n    const input = event.target, control = spec.controls.find(item => item.key === input.dataset.key);\n    if (!control) return;\n    state[control.key] = control.type === 'checkbox' ? input.checked\n      : control.type === 'select' ? control.options.find(option => String(option.value) === input.value).value : Number(input.value);\n    render();\n  });\n  $('#reset').addEventListener('click', () => {state = {...spec.initial}; render();});\n  function validState(next) {\n    return next && typeof next === 'object' && Object.keys(next).length === spec.controls.length && spec.controls.every(c => {\n      const value = next[c.key];\n      return c.type === 'checkbox' ? typeof value === 'boolean' : c.type === 'select'\n        ? c.options.some(option => option.value === value) : Number.isFinite(value) && value >= c.min && value \u003c= c.max && Math.abs((value-c.min)/c.step-Math.round((value-c.min)/c.step)) \u003c 1e-7;\n    });\n  }\n  function restoreScene() {\n    const hash = new URLSearchParams(location.hash.slice(1)), scene = hash.get('scene'), encoded = hash.get('state');\n    if (!scene && !encoded) return;\n    state = {...spec.initial};\n    try {\n      if (scene && scene !== 'explore') throw Error('未知场景');\n      if (encoded) {\n        const overlay = JSON.parse(encoded);\n        if (!overlay || typeof overlay !== 'object' || Array.isArray(overlay) || Object.keys(overlay).some(key => !['math', 'view', 'lesson'].includes(key))) throw Error('状态分组不合法');\n        const next = {...spec.initial};\n        for (const [group, values] of Object.entries(overlay)) {\n          if (!values || typeof values !== 'object' || Array.isArray(values)) throw Error('状态分组不合法');\n          for (const [key, value] of Object.entries(values)) {\n            if (!spec.stateKeys[group].includes(key)) throw Error('未知或错组参数');\n            next[key] = value;\n          }\n        }\n        if (!validState(next)) throw Error('参数超出范围');\n        state = next;\n      }\n      render();\n    } catch (error) {\n      state = {...spec.initial}; render();\n      $('#note').textContent = error.message + '，已恢复默认探索状态。' + $('#note').textContent;\n    }\n  }\n  addEventListener('hashchange', restoreScene);\n  window.TixuPlugin = {\n    getState: () => ({...state}),\n    setState: next => {if (!validState(next)) throw Error('模块参数超出定义范围'); state = {...next}; render();},\n    pause: () => {},\n  };\n  render();\n  restoreScene();\n})();\n\u003c/script>\u003c/body>\u003c/html>"},{"id":"bayes-base-rate","title":"检出率不变，阳性者的判断为什么会变","goal":"用10000人的期望频数追踪真正的分母，区分检出率与阳性者中实际患病的概率。","placements":[{"label":"选择性必修第二册 7.1 条件概率与相关公式","teacher":"x2/x2-7-1/teacher.html#x2-7-1-b23","student":"x2/x2-7-1/student.html#x2-7-1-b23"}],"html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>检出率不变，阳性者的判断为什么会变\u003c/title>\u003cstyle>:root{--ink:#273d33;--accent:#27685c;--secondary:#346da1;--warm:#ae6036;--line:#d8ded1;--paper:#fffef8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:12px/1.6 \"PingFang SC\",\"Microsoft YaHei\",sans-serif}main{padding:10px 12px}.lab-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(180px,1fr);gap:14px}.figure{min-width:0;background:linear-gradient(140deg,#f7f9f1,#fffef8);border:1px solid var(--line);border-radius:3px;overflow:hidden}svg{display:block;width:100%;height:auto;max-height:350px}svg path,svg line{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}svg .grid{stroke:#e4e9df;stroke-width:.6}svg .axis{stroke:#9cae9e;stroke-width:1}svg .curve{stroke:var(--accent);stroke-width:2.5}svg .secondary{stroke:var(--secondary);stroke-width:2}svg .highlight{stroke:var(--warm);stroke-width:2.5}svg .aux{stroke:#829784;stroke-width:1.3}svg .dashed{stroke:#829784;stroke-width:1.3;stroke-dasharray:5 4}svg .area{fill:#d4e8dc99;stroke:var(--accent);stroke-width:1.2}svg .point{fill:var(--accent);stroke:var(--paper);stroke-width:1.3}svg text{font:12px \"PingFang SC\",sans-serif;fill:var(--ink)}svg .label{font-size:12px}svg circle.secondary{fill:var(--secondary)}svg circle.highlight{fill:var(--warm)}.formula{font-size:17px;padding:8px;background:#ecf1e6;border-left:2px solid var(--accent);overflow:auto}.formula math{max-width:100%}h3{font:600 17px/1.5 \"Songti SC\",\"STSong\",serif;margin:0 0 7px}.hint{font-size:10px;color:#6a7d68;margin:5px 8px}#metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}#metrics div{border-top:1px solid var(--line);padding:5px 0;min-width:0}small{display:block;color:#7b8875;font-size:10px}strong{font:500 14px/1.5 \"PingFang SC\",sans-serif;overflow-wrap:anywhere}#note{font-size:11px;color:#61745f;line-height:1.7}#controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}label{min-width:0;font-size:11px}label output{float:right;color:var(--accent);font-variant-numeric:tabular-nums}input[type=range]{display:block;width:100%;margin:6px 0;accent-color:var(--accent)}select{display:block;width:100%;font:11px \"PingFang SC\",sans-serif;padding:5px;background:var(--paper);border:1px solid #c5d0bf}.check{display:flex;align-items:center;gap:5px}button{font:11px \"PingFang SC\",sans-serif;padding:5px 12px;background:transparent;border:1px solid #bbcbb4;color:var(--accent);cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ae6036;outline-offset:2px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:10px;color:#788574}@media(max-width:600px){.lab-grid{grid-template-columns:1fr;gap:9px}#controls{grid-template-columns:repeat(2,minmax(0,1fr))}svg{max-height:280px}.formula{font-size:15px}#metrics{margin:7px 0}.bottom{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}\n.lab-grid>div{min-width:0}@media(max-width:600px){.lab-grid{grid-template-columns:minmax(0,1fr)}}\nmain>.formula{margin-bottom:8px}\n.lab-proof{margin-top:10px;border-top:1px solid #d8ded1;padding-top:7px}.lab-proof summary{cursor:pointer;color:#27685c;font-weight:600}.lab-proof p{margin:8px 0}.lab-proof math{max-width:100%;overflow-x:auto;padding:5px 0}\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>(\u003c/mo>\u003cmi>D\u003c/mi>\u003cmo>|\u003c/mo>\u003cmo>+\u003c/mo>\u003cmo>)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>p\u003c/mi>\u003cmi>s\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>p\u003c/mi>\u003cmi>s\u003c/mi>\u003cmo>+\u003c/mo>\u003cmo>(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>)\u003c/mo>\u003cmi>q\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmspace width=\"1em\"/>\u003cmtext>分母须大于0\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"lab-grid\">\u003cdiv class=\"figure\">\u003csvg id=\"diagram\" viewBox=\"0 0 600 360\" role=\"img\" aria-label=\"检出率不变，阳性者的判断为什么会变\">\u003c/svg>\u003c/div>\u003cdiv>\u003cdiv id=\"metrics\" aria-live=\"polite\">\u003c/div>\u003cp id=\"note\">\u003c/p>\u003c/div>\u003c/div>\u003cdiv id=\"controls\">\u003c/div>\u003cdetails class=\"lab-proof\">\u003csummary>为什么成立 · 条件与推导\u003c/summary>\u003cdiv>\u003cp>这是教师选学的贝叶斯拓展。设事件 D 为实际患病，符号“+”表示检测阳性；D 上的横线表示未患病。三个模型参数定义为：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>p\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>P\u003c/mi>\u003cmo>(\u003c/mo>\u003cmi>D\u003c/mi>\u003cmo>)\u003c/mo>\u003cmo>，\u003c/mo>\u003cmi>s\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>P\u003c/mi>\u003cmo>(\u003c/mo>\u003cmo>+\u003c/mo>\u003cmo>|\u003c/mo>\u003cmi>D\u003c/mi>\u003cmo>)\u003c/mo>\u003cmo>，\u003c/mo>\u003cmi>q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>P\u003c/mi>\u003cmo>(\u003c/mo>\u003cmo>+\u003c/mo>\u003cmo>|\u003c/mo>\u003cmover>\u003cmi>D\u003c/mi>\u003cmo>¯\u003c/mo>\u003c/mover>\u003cmo>)\u003c/mo>\u003c/math>\u003cp>其中患病率 p、检出率 s、误报率 q 均介于零与一之间。先把阳性者分成互不相交的两部分：实际患病且阳性，未患病但阳性。由概率乘法公式与全概率公式，得到：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>(\u003c/mo>\u003cmi>D\u003c/mi>\u003cmo>∩\u003c/mo>\u003cmo>+\u003c/mo>\u003cmo>)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi>p\u003c/mi>\u003cmi>s\u003c/mi>\u003cmo>，\u003c/mo>\u003cmi>P\u003c/mi>\u003cmo>(\u003c/mo>\u003cmover>\u003cmi>D\u003c/mi>\u003cmo>¯\u003c/mo>\u003c/mover>\u003cmo>∩\u003c/mo>\u003cmo>+\u003c/mo>\u003cmo>)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmo>(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>)\u003c/mo>\u003cmi>q\u003c/mi>\u003c/math>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>(\u003c/mo>\u003cmo>+\u003c/mo>\u003cmo>)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi>p\u003c/mi>\u003cmi>s\u003c/mi>\u003cmo>+\u003c/mo>\u003cmo>(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>)\u003c/mo>\u003cmi>q\u003c/mi>\u003c/math>\u003cp>现在只在阳性者中判断患病比例，条件概率的分母必须是全部阳性者，而不是全部患病者。因此，只要阳性概率大于零，就有：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>(\u003c/mo>\u003cmi>D\u003c/mi>\u003cmo>|\u003c/mo>\u003cmo>+\u003c/mo>\u003cmo>)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo>(\u003c/mo>\u003cmi>D\u003c/mi>\u003cmo>∩\u003c/mo>\u003cmo>+\u003c/mo>\u003cmo>)\u003c/mo>\u003c/mrow>\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo>(\u003c/mo>\u003cmo>+\u003c/mo>\u003cmo>)\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>p\u003c/mi>\u003cmi>s\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>p\u003c/mi>\u003cmi>s\u003c/mi>\u003cmo>+\u003c/mo>\u003cmo>(\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>p\u003c/mi>\u003cmo>)\u003c/mo>\u003cmi>q\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003cp>乘以一万人后，分子是真阳性期望数，分母是真阳性与假阳性期望数之和。默认参数下，真阳性九十九，假阳性四百九十五，所以阳性者中实际患病的概率为：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmfrac>\u003cmrow>\u003cmn>99\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmn>99\u003c/mn>\u003cmo>+\u003c/mo>\u003cmn>495\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmn>6\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003cp>检出率虽为百分之九十九，反向条件概率却只有六分之一，两者的条件群体不同。改变患病率，即使检出率和误报率保持不变，真阳性和假阳性的相对数量仍会变化。\u003c/p>\u003cp>边界必须单独解释：患病率为零时，患病条件群体为空，检出率只保留为模型设定，对应条件概率未定义；患病率为一时，未患病组的条件概率同样未定义。若阳性总概率为零，反向条件概率的分母为零，不能显示成百分之零。这里频数始终是模型期望值，可以为小数，不是一次实测人数；树形框大小不代表人数，只有底部构成条按比例绘制。\u003c/p>\u003c/div>\u003c/details>\u003cdiv class=\"bottom\">\u003cspan>改变参数，观察关系；图形取样不能替代证明。\u003c/span>\u003cbutton id=\"reset\">恢复初始状态\u003c/button>\u003c/div>\u003c/main>\u003cscript>window.LAB_SPEC={\"id\":\"bayes-base-rate\",\"title\":\"检出率不变，阳性者的判断为什么会变\",\"goal\":\"用10000人的期望频数追踪真正的分母，区分检出率与阳性者中实际患病的概率。\",\"summary\":\"教师选学拓展。记 D 为患病，+ 为阳性，患病率为 p，模型检出率为 s，模型误报率为 q。10000人模型中，真阳性期望数为10000ps，假阳性为10000(1−p)q。只看阳性者时，分母为两者之和；因此在 ps+(1−p)q>0 时，P(D|+)=ps/[ps+(1−p)q]。这由条件概率和全概率公式得到，不是把P(+|D)直接倒过来。P(+|D)=s 还要求 p>0；p=0时该条件概率未定义，s仅保留为模型参数；p=1时误报率的条件群体同样为空。频数全部为模型期望数，可能不是整数，非一次实测人数。树形框与连线不按人数比例，底部阳性构成条按真实比例绘制；结论不依赖画面面积的猜测。\",\"formula\":\"\u003cmath xmlns=\\\"http://www.w3.org/1998/Math/MathML\\\" display=\\\"block\\\">\u003cmi>P\u003c\\/mi>\u003cmo>(\u003c\\/mo>\u003cmi>D\u003c\\/mi>\u003cmo>|\u003c\\/mo>\u003cmo>+\u003c\\/mo>\u003cmo>)\u003c\\/mo>\u003cmo>=\u003c\\/mo>\u003cmfrac>\u003cmrow>\u003cmi>p\u003c\\/mi>\u003cmi>s\u003c\\/mi>\u003c\\/mrow>\u003cmrow>\u003cmi>p\u003c\\/mi>\u003cmi>s\u003c\\/mi>\u003cmo>+\u003c\\/mo>\u003cmo>(\u003c\\/mo>\u003cmn>1\u003c\\/mn>\u003cmo>−\u003c\\/mo>\u003cmi>p\u003c\\/mi>\u003cmo>)\u003c\\/mo>\u003cmi>q\u003c\\/mi>\u003c\\/mrow>\u003c\\/mfrac>\u003cmspace width=\\\"1em\\\"/>\u003cmtext>分母须大于0\u003c\\/mtext>\u003c\\/math>\",\"controls\":[{\"key\":\"prevalence\",\"label\":\"患病率 p（%）\",\"type\":\"range\",\"min\":0,\"max\":100,\"step\":0.1},{\"key\":\"sensitivity\",\"label\":\"模型检出率 s（%）\",\"type\":\"range\",\"min\":0,\"max\":100,\"step\":1},{\"key\":\"falsePositive\",\"label\":\"模型误报率 q（%）\",\"type\":\"range\",\"min\":0,\"max\":100,\"step\":0.1}],\"initial\":{\"prevalence\":1,\"sensitivity\":99,\"falsePositive\":5},\"stateKeys\":{\"math\":[\"prevalence\",\"sensitivity\",\"falsePositive\"],\"view\":[],\"lesson\":[]}};\u003c/script>\u003cscript>(() => {\n  'use strict';\n  const escape = value => String(value).replace(/[&\u003c>\"']/g, ch => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch]));\n  const fmt = (value, digits = 3) => Number.isFinite(value) ? String(Number(value.toFixed(digits))) : '不适用';\n  const path = (points, cls = 'curve', close = false) => {\n    const valid = points.filter(point => point && point.every(Number.isFinite));\n    if (!valid.length) return '';\n    return `\u003cpath class=\"${escape(cls)}\" d=\"${valid.map((p, i) => (i ? 'L' : 'M') + p.map(n => n.toFixed(2)).join(',')).join(' ')}${close ? 'Z' : ''}\"/>`;\n  };\n  const line = (p, q, cls = 'aux') => path([p, q], cls);\n  const text = (x, y, value, cls = 'label') => `\u003ctext x=\"${fmt(x, 2)}\" y=\"${fmt(y, 2)}\" class=\"${escape(cls)}\">${escape(value)}\u003c/text>`;\n  const dot = (p, label = '', cls = 'point') => `\u003ccircle cx=\"${fmt(p[0], 2)}\" cy=\"${fmt(p[1], 2)}\" r=\"4\" class=\"${escape(cls)}\"/>` + (label ? text(p[0] + 7, p[1] - 8, label) : '');\n  function world(xmin, xmax, ymin, ymax) {\n    const scale = Math.min(516 / (xmax - xmin), 278 / (ymax - ymin));\n    const ox = 300 - (xmin + xmax) * scale / 2, oy = 180 + (ymin + ymax) * scale / 2;\n    const p = (x, y) => [ox + x * scale, oy - y * scale];\n    let axes = '';\n    const step = Math.pow(10, Math.floor(Math.log10(Math.max(xmax - xmin, ymax - ymin) / 7)));\n    const increment = Math.max(step, 1e-4);\n    let count = 0;\n    for (let x = Math.ceil(xmin / increment) * increment; x \u003c= xmax && count \u003c 90; x += increment, count++) axes += line(p(x, ymin), p(x, ymax), 'grid');\n    count = 0;\n    for (let y = Math.ceil(ymin / increment) * increment; y \u003c= ymax && count \u003c 90; y += increment, count++) axes += line(p(xmin, y), p(xmax, y), 'grid');\n    if (ymin \u003c= 0 && ymax >= 0) axes += line(p(xmin, 0), p(xmax, 0), 'axis') + text(...p(xmax, 0), 'x');\n    if (xmin \u003c= 0 && xmax >= 0) axes += line(p(0, ymin), p(0, ymax), 'axis') + text(...p(0, ymax), 'y');\n    if (xmin \u003c 0 && xmax > 0 && ymin \u003c 0 && ymax > 0) axes += text(ox - 14, oy + 17, 'O');\n    return {p, axes, scale};\n  }\n  function project(point, yaw = 35, elevation = 25, scale = 34, origin = [300, 190]) {\n    const a = yaw * Math.PI / 180, b = elevation * Math.PI / 180;\n    const horizontal = point[0] * Math.cos(a) - point[1] * Math.sin(a);\n    const depth = point[0] * Math.sin(a) + point[1] * Math.cos(a);\n    return [origin[0] + horizontal * scale, origin[1] - (point[2] * Math.cos(b) - depth * Math.sin(b)) * scale];\n  }\n  window.LabTools = {escape, fmt, path, line, text, dot, world, project,\n    polygon: (points, cls = 'area') => path(points, cls, true),\n    sample: (fn, from, to, count = 120) => Array.from({length: count + 1}, (_, i) => fn(from + (to - from) * i / count))};\n})();\n\u003c/script>\u003cscript>(() => {\n  'use strict';\n  const pairs = repeat => Array.from({length: 6}, (_, i) => Array.from({length: 6}, (_, j) => [i + 1, j + 1])).flat().filter(([i, j]) => repeat || i !== j);\n  const key = pair => pair.slice().sort((a, b) => a - b).join('-');\n  const box = (x, y, w, h, fill, stroke = '#a6b8af') => `\u003crect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${h}\" rx=\"4\" fill=\"${fill}\" stroke=\"${stroke}\"/>`;\n  const defs = {\n    'parameter-cubic-roots': {\n      model(s) {\n        const a = Number(s.a);\n        let roots;\n        if (a === 2) roots = [{x: -1, multiplicity: 2}, {x: 2, multiplicity: 1}];\n        else if (a === -2) roots = [{x: -2, multiplicity: 1}, {x: 1, multiplicity: 2}];\n        else if (Math.abs(a) \u003c 2) {\n          const theta = Math.acos(a / 2) / 3;\n          roots = [0, 1, 2].map(k => ({x: 2 * Math.cos(theta - 2 * Math.PI * k / 3), multiplicity: 1})).sort((p, q) => p.x - q.x);\n        } else {\n          const delta = Math.sqrt(a * a / 4 - 1);\n          roots = [{x: Math.cbrt(a / 2 + delta) + Math.cbrt(a / 2 - delta), multiplicity: 1}];\n        }\n        return {a, roots, count: roots.length, realMultiplicity: roots.reduce((sum, r) => sum + r.multiplicity, 0), critical: Math.abs(a) === 2,\n          derivative: '3(x²−1)', monotonicity: ['增', '减', '增'], extrema: [[-1, 2], [1, -2]]};\n      },\n      render(s, L) {\n        const m = this.model(s), p = (x, y) => [300 + 94 * x, 177 - 25 * y], f = x => x ** 3 - 3 * x;\n        let svg = L.line(p(-2.65, 0), p(2.65, 0), 'axis') + L.line(p(0, -5), p(0, 5), 'axis');\n        for (const x of [-2, -1, 1, 2]) svg += L.text(p(x, 0)[0] - 5, 195, String(x));\n        for (const y of [-4, -2, 2, 4]) svg += L.text(277, p(0, y)[1] + 4, String(y));\n        const curve = fn => L.sample(x => [x, fn(x)], -2.5, 2.5, 400).filter(([, y]) => Math.abs(y) \u003c= 5).map(([x, y]) => p(x, y));\n        svg += L.path(curve(f), 'curve') + L.line(p(-2.65, m.a), p(2.65, m.a), 'highlight');\n        if (s.showDerivative) svg += L.path(curve(x => 3 * (x * x - 1)), 'secondary');\n        for (const [x, y] of m.extrema) svg += L.line(p(x, 0), p(x, y), 'dashed') + L.dot(p(x, y));\n        m.roots.forEach((r, i) => { svg += L.dot(p(r.x, m.a), `x${i + 1}${r.multiplicity === 2 ? '（二重）' : ''}`, 'highlight'); });\n        svg += L.text(30, 25, s.showDerivative ? '绿：f(x)；橙：y=a；蓝：f′(x)' : '绿：f(x)；橙：y=a') + L.text(540, 168, 'x') + L.text(309, 45, 'y');\n        svg += L.text(45, 325, 'f′：正 → 0 → 负 → 0 → 正') + L.text(45, 347, 'f：增（x\u003c−1）／减（−1\u003cx\u003c1）／增（x>1）');\n        const roots = m.roots.map(r => `${L.fmt(r.x, 5)}${r.multiplicity === 2 ? '（二重）' : ''}`).join('，');\n        return {svg, metrics: [['参数 a', L.fmt(m.a, 2)], ['不同实根数', String(m.count)], ['实根（近似）', roots], ['实根按重数计', String(m.realMultiplicity)]],\n          note: `f′(x)=3(x−1)(x+1)，故三个单调区间依次增、减、增，且 f(−1)=2、f(1)=−2；再结合两端趋势可严格分类：−2\u003ca\u003c2 有三个不同实根，a=±2 有两个不同实根，其中一个为二重根，|a|>2 仅一个实根（另两根非实数）。${m.critical ? '当前恰在临界值，水平线在极值点相切。' : '将 a 调到精确的 −2 或 2，比较临界值两侧。'}图像用于观察，根数结论由单调性及各段值域保证，不靠屏幕采样。临界值的因式分解见“为什么成立 · 条件与推导”。`};\n      }\n    },\n    'counting-equal-multiplicity': {\n      model(s) {\n        const dice = s.scenario === 'dice', ordered = pairs(dice), groups = [];\n        for (const pair of ordered) {\n          const k = key(pair); let g = groups.find(group => group.key === k);\n          if (!g) {g = {key: k, pair: pair.slice().sort((a, b) => a - b), preimages: []}; groups.push(g);}\n          g.preimages.push(pair);\n        }\n        groups.sort((a, b) => a.pair[0] - b.pair[0] || a.pair[1] - b.pair[1]);\n        const selected = groups.find(g => g.key === s.result) || null;\n        return {dice, ordered, groups, orderedCount: ordered.length, finalCount: groups.length, equalMultiplicity: !dice,\n          selectedKey: s.result, selected, selectedExists: !!selected, multiplicity: selected ? selected.preimages.length : 0,\n          selectedProbability: selected ? selected.preimages.length / ordered.length : 0};\n      },\n      render(s, L) {\n        const m = this.model(s); let svg = L.text(28, 26, `有序过程：${m.orderedCount} 个`) + L.text(333, 26, `归并后：${m.finalCount} 个`);\n        for (let i = 1; i \u003c= 6; i++) for (let j = 1; j \u003c= 6; j++) {\n          const valid = m.dice || i !== j, active = valid && key([i, j]) === m.selectedKey, x = 28 + (j - 1) * 39, y = 52 + (i - 1) * 42;\n          svg += box(x, y, 36, 34, active ? '#f2ccaa' : valid ? '#e1ede5' : '#f1f0eb');\n          svg += L.text(x + 4, y + 21, valid ? `${i},${j}` : '—');\n        }\n        svg += L.line([270, 176], [312, 176], 'highlight') + L.text(275, 163, '归并');\n        m.groups.forEach((g, index) => {\n          const x = 333 + index % 3 * 83, y = 52 + Math.floor(index / 3) * 37;\n          svg += box(x, y, 77, 30, g.key === m.selectedKey ? '#f2ccaa' : '#edf2ee', g.key === m.selectedKey ? '#a15b2b' : '#a6b8af');\n          svg += L.text(x + 8, y + 20, `{${g.pair.join(',')}}`);\n        });\n        svg += L.text(28, 334, m.dice ? '先区分两枚骰子，再忽略顺序' : '从六个不同元素中依次取两个，不放回');\n        const preimages = m.selected ? m.selected.preimages.map(p => `(${p.join(',')})`).join('、') : '不存在（不能两次选同一元素）';\n        return {svg, metrics: [['对应的有序过程', preimages], ['当前结果被计次数', String(m.multiplicity)], ['每个结果重复次数相同？', m.equalMultiplicity ? '相同，均为2' : '不同：同点数1，异点数2'], ['当前结果概率', m.selected ? `${m.multiplicity}/${m.orderedCount}` : '0（不属于结果集）']],\n          note: m.dice ? '两枚可区分的公平骰子独立投掷，36个有序结果等可能。忽略顺序后共有21组：6组同点数各对应1个过程，15组异点数各对应2个过程，因此36不能统一除以2；也不能把这21组视为等可能。当前高亮的左侧小格就是右侧选中结果的全部来源。'\n            : '从1至6六个不同元素中依次等可能地不放回取两个，有30个有序过程。每组不同元素恰对应两种顺序，故组合数为30÷2=15；统一相除的依据是“每个结果被计次数都相同”，不只是结果忽略顺序。选择含相同元素的结果时，它在此场景中不存在；切换骰子场景后才允许重复。'};\n      }\n    },\n    'bayes-base-rate': {\n      model(s) {\n        const n = 10000, prevalence = Number(s.prevalence) / 100, sensitivity = Number(s.sensitivity) / 100, falsePositive = Number(s.falsePositive) / 100;\n        const disease = n * prevalence, healthy = n - disease, tp = disease * sensitivity, fn = disease - tp, fp = healthy * falsePositive, tn = healthy - fp, positive = tp + fp;\n        return {n, prevalence, sensitivity, falsePositive, disease, healthy, tp, fn, fp, tn, positive,\n          positiveRate: positive / n, posterior: positive > 0 ? tp / positive : null,\n          conditionalDetection: disease > 0 ? sensitivity : null, conditionalFalsePositive: healthy > 0 ? falsePositive : null,\n          integerCounts: [disease, healthy, tp, fn, fp, tn].every(x => Math.abs(x - Math.round(x)) \u003c 1e-8)};\n      },\n      render(s, L) {\n        const m = this.model(s), count = x => L.fmt(x, 3);\n        let svg = L.text(26, 24, '10000人的模型期望频数；框与连线不按人数比例绘制');\n        svg += L.dot([66, 155], '') + L.text(26, 178, '全体10000');\n        svg += L.line([70, 155], [166, 83], 'aux') + L.line([70, 155], [166, 224], 'aux');\n        const nodes = [[166, 56, '实际患病', m.disease, '#dbe9e0'], [166, 197, '实际未患病', m.healthy, '#e0e8ee']];\n        for (const [x, y, label, value, fill] of nodes) svg += box(x, y, 136, 56, fill) + L.text(x + 10, y + 22, label) + L.text(x + 10, y + 44, count(value));\n        const outcomes = [[371, 40, '阳性／真阳性', m.tp, '#efc8a4'], [371, 108, '阴性／漏检', m.fn, '#e6eee8'], [371, 181, '阳性／假阳性', m.fp, '#b5cddd'], [371, 249, '阴性／真阴性', m.tn, '#e6eee8']];\n        for (const [x, y, label, value, fill] of outcomes) {\n          const parentY = y \u003c 170 ? 84 : 225;\n          svg += L.line([302, parentY], [x, y + 23], 'aux') + box(x, y, 196, 47, fill) + L.text(x + 9, y + 19, label) + L.text(x + 9, y + 39, count(value));\n        }\n        if (m.posterior !== null) {\n          svg += box(166, 319, 401 * m.posterior, 18, '#efc8a4') + box(166 + 401 * m.posterior, 319, 401 * (1 - m.posterior), 18, '#b5cddd');\n          svg += L.text(26, 333, '只看阳性者') + L.text(166, 354, '橙：真阳性；蓝：假阳性（本条宽度按比例）');\n        } else svg += L.text(166, 333, '阳性者为空：不能计算其内部比例');\n        return {svg, metrics: [['P(阳性 | 患病)', m.conditionalDetection === null ? '未定义：患病组为空' : `${L.fmt(100 * m.sensitivity, 2)}%`], ['阳性者期望总数', count(m.positive)], ['P(患病 | 阳性)', m.posterior === null ? '未定义：阳性概率为0' : `${L.fmt(100 * m.posterior, 3)}%`], ['频数性质', '模型期望值，非实测人数']],\n          note: `这是教学模型，不是医疗建议。三个参数 p、s、q 分别是患病率、模型检出率和模型误报率；改变患病率并不会改变后两项设定，却会改变阳性者构成。反向条件的分母是真阳性与假阳性之和，而不是全体患病者。${m.posterior === null ? '当前没有阳性者，条件概率的分母为0，故不显示为0%。' : '底部只在阳性者内重新计算比例，没有把漏检和真阴性计入分母。'}${m.prevalence === 0 ? '患病组为空时，设定的检出率仍是模型参数，但P(阳性|患病)本身未定义。' : ''}${m.prevalence === 1 ? '未患病组为空，误报率仅作为模型参数，其对应条件概率未定义。' : ''}频数均是10000人模型中的期望数，可为小数，显示值保留三位；不把它们伪装成一次真实观测。贝叶斯公式作为教师选学拓展，展开“为什么成立 · 条件与推导”核对条件与分母。`};\n      }\n    }\n  };\n  window.TEXTBOOK_EXPERIMENTS = Object.assign(window.TEXTBOOK_EXPERIMENTS || {}, defs);\n})();\n\u003c/script>\u003cscript>(() => {\n  'use strict';\n  const spec = window.LAB_SPEC, experiment = window.TEXTBOOK_EXPERIMENTS[spec.id], L = window.LabTools;\n  let state = {...spec.initial};\n  const $ = selector => document.querySelector(selector);\n  const controls = $('#controls');\n  controls.innerHTML = spec.controls.map(control => {\n    const label = L.escape(control.label), key = L.escape(control.key);\n    if (control.type === 'select') return `\u003clabel>${label}\u003cselect data-key=\"${key}\">${control.options.map(option => `\u003coption value=\"${L.escape(option.value)}\">${L.escape(option.label)}\u003c/option>`).join('')}\u003c/select>\u003c/label>`;\n    if (control.type === 'checkbox') return `\u003clabel class=\"check\">\u003cinput data-key=\"${key}\" type=\"checkbox\">${label}\u003c/label>`;\n    return `\u003clabel>${label}\u003coutput data-output=\"${key}\">\u003c/output>\u003cinput data-key=\"${key}\" type=\"range\" min=\"${control.min}\" max=\"${control.max}\" step=\"${control.step}\">\u003c/label>`;\n  }).join('');\n  function render() {\n    const result = experiment.render({...state}, L);\n    $('#diagram').innerHTML = result.svg;\n    $('#metrics').innerHTML = (result.metrics || []).map(([label, value]) => `\u003cdiv>\u003csmall>${L.escape(label)}\u003c/small>\u003cstrong>${L.escape(value)}\u003c/strong>\u003c/div>`).join('');\n    $('#note').textContent = result.note || '';\n    for (const control of spec.controls) {\n      const input = controls.querySelector(`[data-key=\"${control.key}\"]`);\n      if (control.type === 'checkbox') input.checked = state[control.key];\n      else input.value = state[control.key];\n      const output = controls.querySelector(`[data-output=\"${control.key}\"]`);\n      if (output) output.textContent = L.fmt(state[control.key], 4);\n    }\n    window.__textbookLab = {id: spec.id, state: {...state}, model: experiment.model({...state})};\n  }\n  controls.addEventListener('input', event => {\n    const input = event.target, control = spec.controls.find(item => item.key === input.dataset.key);\n    if (!control) return;\n    state[control.key] = control.type === 'checkbox' ? input.checked\n      : control.type === 'select' ? control.options.find(option => String(option.value) === input.value).value : Number(input.value);\n    render();\n  });\n  $('#reset').addEventListener('click', () => {state = {...spec.initial}; render();});\n  function validState(next) {\n    return next && typeof next === 'object' && Object.keys(next).length === spec.controls.length && spec.controls.every(c => {\n      const value = next[c.key];\n      return c.type === 'checkbox' ? typeof value === 'boolean' : c.type === 'select'\n        ? c.options.some(option => option.value === value) : Number.isFinite(value) && value >= c.min && value \u003c= c.max && Math.abs((value-c.min)/c.step-Math.round((value-c.min)/c.step)) \u003c 1e-7;\n    });\n  }\n  function restoreScene() {\n    const hash = new URLSearchParams(location.hash.slice(1)), scene = hash.get('scene'), encoded = hash.get('state');\n    if (!scene && !encoded) return;\n    state = {...spec.initial};\n    try {\n      if (scene && scene !== 'explore') throw Error('未知场景');\n      if (encoded) {\n        const overlay = JSON.parse(encoded);\n        if (!overlay || typeof overlay !== 'object' || Array.isArray(overlay) || Object.keys(overlay).some(key => !['math', 'view', 'lesson'].includes(key))) throw Error('状态分组不合法');\n        const next = {...spec.initial};\n        for (const [group, values] of Object.entries(overlay)) {\n          if (!values || typeof values !== 'object' || Array.isArray(values)) throw Error('状态分组不合法');\n          for (const [key, value] of Object.entries(values)) {\n            if (!spec.stateKeys[group].includes(key)) throw Error('未知或错组参数');\n            next[key] = value;\n          }\n        }\n        if (!validState(next)) throw Error('参数超出范围');\n        state = next;\n      }\n      render();\n    } catch (error) {\n      state = {...spec.initial}; render();\n      $('#note').textContent = error.message + '，已恢复默认探索状态。' + $('#note').textContent;\n    }\n  }\n  addEventListener('hashchange', restoreScene);\n  window.TixuPlugin = {\n    getState: () => ({...state}),\n    setState: next => {if (!validState(next)) throw Error('模块参数超出定义范围'); state = {...next}; render();},\n    pause: () => {},\n  };\n  render();\n  restoreScene();\n})();\n\u003c/script>\u003c/body>\u003c/html>"},{"id":"ssa-circle-ray","title":"SSA为何不唯一：圆与射线的有效交点","goal":"将可能的三角形个数转化为有效交点数，辨别相切、反向交点及退化解。","placements":[{"label":"必修第二册 6.3 解三角形","teacher":"bx2/bx2-6-3/teacher.html#bx2-6-3-b3","student":"bx2/bx2-6-3/student.html#bx2-6-3-b3"}],"html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>SSA为何不唯一：圆与射线的有效交点\u003c/title>\u003cstyle>:root{--ink:#273d33;--accent:#27685c;--secondary:#346da1;--warm:#ae6036;--line:#d8ded1;--paper:#fffef8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:12px/1.6 \"PingFang SC\",\"Microsoft YaHei\",sans-serif}main{padding:10px 12px}.lab-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(180px,1fr);gap:14px}.figure{min-width:0;background:linear-gradient(140deg,#f7f9f1,#fffef8);border:1px solid var(--line);border-radius:3px;overflow:hidden}svg{display:block;width:100%;height:auto;max-height:350px}svg path,svg line{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}svg .grid{stroke:#e4e9df;stroke-width:.6}svg .axis{stroke:#9cae9e;stroke-width:1}svg .curve{stroke:var(--accent);stroke-width:2.5}svg .secondary{stroke:var(--secondary);stroke-width:2}svg .highlight{stroke:var(--warm);stroke-width:2.5}svg .aux{stroke:#829784;stroke-width:1.3}svg .dashed{stroke:#829784;stroke-width:1.3;stroke-dasharray:5 4}svg .area{fill:#d4e8dc99;stroke:var(--accent);stroke-width:1.2}svg .point{fill:var(--accent);stroke:var(--paper);stroke-width:1.3}svg text{font:12px \"PingFang SC\",sans-serif;fill:var(--ink)}svg .label{font-size:12px}svg circle.secondary{fill:var(--secondary)}svg circle.highlight{fill:var(--warm)}.formula{font-size:17px;padding:8px;background:#ecf1e6;border-left:2px solid var(--accent);overflow:auto}.formula math{max-width:100%}h3{font:600 17px/1.5 \"Songti SC\",\"STSong\",serif;margin:0 0 7px}.hint{font-size:10px;color:#6a7d68;margin:5px 8px}#metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}#metrics div{border-top:1px solid var(--line);padding:5px 0;min-width:0}small{display:block;color:#7b8875;font-size:10px}strong{font:500 14px/1.5 \"PingFang SC\",sans-serif;overflow-wrap:anywhere}#note{font-size:11px;color:#61745f;line-height:1.7}#controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}label{min-width:0;font-size:11px}label output{float:right;color:var(--accent);font-variant-numeric:tabular-nums}input[type=range]{display:block;width:100%;margin:6px 0;accent-color:var(--accent)}select{display:block;width:100%;font:11px \"PingFang SC\",sans-serif;padding:5px;background:var(--paper);border:1px solid #c5d0bf}.check{display:flex;align-items:center;gap:5px}button{font:11px \"PingFang SC\",sans-serif;padding:5px 12px;background:transparent;border:1px solid #bbcbb4;color:var(--accent);cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ae6036;outline-offset:2px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:10px;color:#788574}@media(max-width:600px){.lab-grid{grid-template-columns:1fr;gap:9px}#controls{grid-template-columns:repeat(2,minmax(0,1fr))}svg{max-height:280px}.formula{font-size:15px}#metrics{margin:7px 0}.bottom{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}\n.lab-grid>div{min-width:0}@media(max-width:600px){.lab-grid{grid-template-columns:minmax(0,1fr)}}\nmain>.formula{margin-bottom:8px}\n.lab-proof{margin-top:10px;border-top:1px solid #d8ded1;padding-top:7px}.lab-proof summary{cursor:pointer;color:#27685c;font-weight:600}.lab-proof p{margin:8px 0}.lab-proof math{max-width:100%;overflow-x:auto;padding:5px 0}\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsup>\u003cmrow>\u003cmo>(\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>3\u003c/mn>\u003cmi>cos\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>)\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmsup>\u003cmi>h\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmi>a\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>，\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>3\u003c/mn>\u003cmi>sin\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>，\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo>&gt;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/math>\u003c/div>\u003cdiv class=\"lab-grid\">\u003cdiv class=\"figure\">\u003csvg id=\"diagram\" viewBox=\"0 0 600 360\" role=\"img\" aria-label=\"SSA为何不唯一：圆与射线的有效交点\">\u003c/svg>\u003c/div>\u003cdiv>\u003cdiv id=\"metrics\" aria-live=\"polite\">\u003c/div>\u003cp id=\"note\">\u003c/p>\u003c/div>\u003c/div>\u003cdiv id=\"controls\">\u003c/div>\u003cdetails class=\"lab-proof\">\u003csummary>为什么成立 · 条件与推导\u003c/summary>\u003cdiv>\u003cp>\u003cstrong>教师拓展。\u003c/strong>目的是看懂多解从哪里来，不要求全体学生背完整分类表。固定角及其邻边，令顶点沿正向射线移动；边长条件转化为圆与射线的交点条件。\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmn>0\u003c/mn>\u003cmo>&lt;\u003c/mo>\u003cmi>A\u003c/mi>\u003cmo>&lt;\u003c/mo>\u003cmn>180\u003c/mn>\u003cmo>°\u003c/mo>\u003cmo>，\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>3\u003c/mn>\u003cmo>，\u003c/mo>\u003cmi>a\u003c/mi>\u003cmo>&gt;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/math>\u003cp>建立坐标后，两点分别为：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>C\u003c/mi>\u003cmo>(\u003c/mo>\u003cmn>3\u003c/mn>\u003cmi>cos\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>,\u003c/mo>\u003cmn>3\u003c/mn>\u003cmi>sin\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>)\u003c/mo>\u003cmo>，\u003c/mo>\u003cmi>B\u003c/mi>\u003cmo>(\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo>,\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo>)\u003c/mo>\u003cmo>，\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo>&gt;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/math>\u003cp>\u003cstrong>先求候选，再查正向。\u003c/strong>圆心到横轴所在直线的距离为高。边长条件等价于：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>h\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>3\u003c/mn>\u003cmi>sin\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>&gt;\u003c/mo>\u003cmn>0\u003c/mn>\u003c/math>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsup>\u003cmrow>\u003cmo>(\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>3\u003c/mn>\u003cmi>cos\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>)\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>+\u003c/mo>\u003cmsup>\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmsup>\u003cmrow>\u003cmi>a\u003c/mi>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/math>\u003cp>半径小于高时没有实数交点。半径不小于高时，候选横坐标为：\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>c\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>3\u003c/mn>\u003cmi>cos\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>±\u003c/mo>\u003cmsqrt>\u003cmsup>\u003cmrow>\u003cmi>a\u003c/mi>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>−\u003c/mo>\u003cmsup>\u003cmrow>\u003cmi>h\u003c/mi>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/msqrt>\u003c/math>\u003cp>两个根重合时只算一个候选；每个候选还必须严格大于零。负数根位于射线的反向延长线上，零根使顶点重合，均不能构成题设三角形。\u003c/p>\u003cp>\u003cstrong>为什么这也是充分条件。\u003c/strong>每个正根都确定正向射线上唯一的点，且到圆心距离等于给定边长；同时高严格为正，三个顶点不共线。因此每个不同正根恰好对应一个非退化三角形，没有额外的角度条件需要补猜。\u003c/p>\u003cp>\u003cstrong>相切不一定有解。\u003c/strong>半径等于高时，唯一候选横坐标如下。锐角时它为正，有一个三角形；直角时为零，退化；钝角时为负，在反向延长线上。\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>a\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>h\u003c/mi>\u003cmo>⇒\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>3\u003c/mn>\u003cmi>cos\u003c/mi>\u003cmi>A\u003c/mi>\u003c/math>\u003cp>\u003cstrong>另一处易漏边界。\u003c/strong>两条已知边相等时，一个候选始终为零，必须剔除；另一个候选仅在已知角为锐角时为正。\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>a\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>b\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>3\u003c/mn>\u003cmo>⇒\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo>或\u003c/mo>\u003cmi>c\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>6\u003c/mn>\u003cmi>cos\u003c/mi>\u003cmi>A\u003c/mi>\u003c/math>\u003c/div>\u003c/details>\u003cdiv class=\"bottom\">\u003cspan>改变参数，观察关系；图形取样不能替代证明。\u003c/span>\u003cbutton id=\"reset\">恢复初始状态\u003c/button>\u003c/div>\u003c/main>\u003cscript>window.LAB_SPEC={\"id\":\"ssa-circle-ray\",\"title\":\"SSA为何不唯一：圆与射线的有效交点\",\"goal\":\"将可能的三角形个数转化为有效交点数，辨别相切、反向交点及退化解。\",\"summary\":\"教师拓展，不将完整SSA分类提升为全体学生必学。固定AC=b=3及角A，令C=(3cosA,3sinA)，B=(c,0)，其中c>0。由BC=a得(c−3cosA)²+h²=a²，h=3sinA。圆与直线的候选交点还须剔除c≤0者。因此a=h虽为相切，却仅在A为锐角时产生一个有效三角形；直角时B=A退化，钝角时切点在反向延长线上。a=b时同样须剔除B=A。动态探索解释分类依据，不能以有限次拖动替代上述方程和有效性验证。\",\"formula\":\"\u003cmath xmlns=\\\"http://www.w3.org/1998/Math/MathML\\\" display=\\\"block\\\">\u003cmsup>\u003cmrow>\u003cmo>(\u003c\\/mo>\u003cmi>c\u003c\\/mi>\u003cmo>−\u003c\\/mo>\u003cmn>3\u003c\\/mn>\u003cmi>cos\u003c\\/mi>\u003cmi>A\u003c\\/mi>\u003cmo>)\u003c\\/mo>\u003c\\/mrow>\u003cmn>2\u003c\\/mn>\u003c\\/msup>\u003cmo>+\u003c\\/mo>\u003cmsup>\u003cmi>h\u003c\\/mi>\u003cmn>2\u003c\\/mn>\u003c\\/msup>\u003cmo>=\u003c\\/mo>\u003cmsup>\u003cmi>a\u003c\\/mi>\u003cmn>2\u003c\\/mn>\u003c\\/msup>\u003cmo>，\u003c\\/mo>\u003cmi>h\u003c\\/mi>\u003cmo>=\u003c\\/mo>\u003cmn>3\u003c\\/mn>\u003cmi>sin\u003c\\/mi>\u003cmi>A\u003c\\/mi>\u003cmo>，\u003c\\/mo>\u003cmi>c\u003c\\/mi>\u003cmo>&gt;\u003c\\/mo>\u003cmn>0\u003c\\/mn>\u003c\\/math>\",\"controls\":[{\"key\":\"A\",\"label\":\"已知角 A\",\"type\":\"range\",\"min\":20,\"max\":160,\"step\":5},{\"key\":\"mode\",\"label\":\"临界状态（优先于比例滑块）\",\"type\":\"select\",\"options\":[{\"value\":\"explore\",\"label\":\"自由探索：使用a/h\"},{\"value\":\"below\",\"label\":\"a=0.95h（相切前）\"},{\"value\":\"height\",\"label\":\"a=h（精确相切）\"},{\"value\":\"above\",\"label\":\"a=1.05h（相切后）\"},{\"value\":\"equal\",\"label\":\"a=b（精确退化候选）\"},{\"value\":\"long\",\"label\":\"a=1.2b（大于已知边）\"}]},{\"key\":\"ratio\",\"label\":\"自由探索时 a/h\",\"type\":\"range\",\"min\":0.5,\"max\":3,\"step\":0.05}],\"initial\":{\"A\":30,\"mode\":\"explore\",\"ratio\":1.5},\"stateKeys\":{\"math\":[\"A\",\"mode\",\"ratio\"],\"view\":[],\"lesson\":[]}};\u003c/script>\u003cscript>(() => {\n  'use strict';\n  const escape = value => String(value).replace(/[&\u003c>\"']/g, ch => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch]));\n  const fmt = (value, digits = 3) => Number.isFinite(value) ? String(Number(value.toFixed(digits))) : '不适用';\n  const path = (points, cls = 'curve', close = false) => {\n    const valid = points.filter(point => point && point.every(Number.isFinite));\n    if (!valid.length) return '';\n    return `\u003cpath class=\"${escape(cls)}\" d=\"${valid.map((p, i) => (i ? 'L' : 'M') + p.map(n => n.toFixed(2)).join(',')).join(' ')}${close ? 'Z' : ''}\"/>`;\n  };\n  const line = (p, q, cls = 'aux') => path([p, q], cls);\n  const text = (x, y, value, cls = 'label') => `\u003ctext x=\"${fmt(x, 2)}\" y=\"${fmt(y, 2)}\" class=\"${escape(cls)}\">${escape(value)}\u003c/text>`;\n  const dot = (p, label = '', cls = 'point') => `\u003ccircle cx=\"${fmt(p[0], 2)}\" cy=\"${fmt(p[1], 2)}\" r=\"4\" class=\"${escape(cls)}\"/>` + (label ? text(p[0] + 7, p[1] - 8, label) : '');\n  function world(xmin, xmax, ymin, ymax) {\n    const scale = Math.min(516 / (xmax - xmin), 278 / (ymax - ymin));\n    const ox = 300 - (xmin + xmax) * scale / 2, oy = 180 + (ymin + ymax) * scale / 2;\n    const p = (x, y) => [ox + x * scale, oy - y * scale];\n    let axes = '';\n    const step = Math.pow(10, Math.floor(Math.log10(Math.max(xmax - xmin, ymax - ymin) / 7)));\n    const increment = Math.max(step, 1e-4);\n    let count = 0;\n    for (let x = Math.ceil(xmin / increment) * increment; x \u003c= xmax && count \u003c 90; x += increment, count++) axes += line(p(x, ymin), p(x, ymax), 'grid');\n    count = 0;\n    for (let y = Math.ceil(ymin / increment) * increment; y \u003c= ymax && count \u003c 90; y += increment, count++) axes += line(p(xmin, y), p(xmax, y), 'grid');\n    if (ymin \u003c= 0 && ymax >= 0) axes += line(p(xmin, 0), p(xmax, 0), 'axis') + text(...p(xmax, 0), 'x');\n    if (xmin \u003c= 0 && xmax >= 0) axes += line(p(0, ymin), p(0, ymax), 'axis') + text(...p(0, ymax), 'y');\n    if (xmin \u003c 0 && xmax > 0 && ymin \u003c 0 && ymax > 0) axes += text(ox - 14, oy + 17, 'O');\n    return {p, axes, scale};\n  }\n  function project(point, yaw = 35, elevation = 25, scale = 34, origin = [300, 190]) {\n    const a = yaw * Math.PI / 180, b = elevation * Math.PI / 180;\n    const horizontal = point[0] * Math.cos(a) - point[1] * Math.sin(a);\n    const depth = point[0] * Math.sin(a) + point[1] * Math.cos(a);\n    return [origin[0] + horizontal * scale, origin[1] - (point[2] * Math.cos(b) - depth * Math.sin(b)) * scale];\n  }\n  window.LabTools = {escape, fmt, path, line, text, dot, world, project,\n    polygon: (points, cls = 'area') => path(points, cls, true),\n    sample: (fn, from, to, count = 120) => Array.from({length: count + 1}, (_, i) => fn(from + (to - from) * i / count))};\n})();\n\u003c/script>\u003cscript>/* Independent geometry models; yaw affects projection only, never the mathematics. */\n(() => {\n  'use strict';\n  const rad = x => x * Math.PI / 180;\n  const clamp = x => Math.max(-1, Math.min(1, x));\n  const open = (L,p) => `\u003ccircle cx=\"${L.fmt(p[0],2)}\" cy=\"${L.fmt(p[1],2)}\" r=\"5\" fill=\"#fffef8\" stroke=\"#ae6036\" stroke-width=\"2\"/>`;\n  const title = (L,t,svg) => `\u003ctitle>${L.escape(t)}\u003c/title>${svg}`;\n  const experiments = {\n    'chord-midpoint-domain': {\n      model(s) {\n        const u=Number(s.u), t=Math.sqrt(5)*u, center=[-4*t/5,t/5], abs=Math.abs(u);\n        const kind=abs\u003c1-1e-12?'secant':abs\u003c=1+1e-12?'tangent':'outside';\n        const d=kind==='secant'?2/5*Math.sqrt(5-t*t):0;\n        const endpoints=kind==='secant'?[[-4*t/5-d,t/5-d],[-4*t/5+d,t/5+d]]:[];\n        return {u,t,center,kind,endpoints,valid:kind==='secant',limits:[[-4/Math.sqrt(5),1/Math.sqrt(5)],[4/Math.sqrt(5),-1/Math.sqrt(5)]],halfChord:Math.SQRT2*d};\n      },\n      render(s,L) {\n        const m=this.model(s),W=L.world(-3.2,3.2,-2.2,2.2),p=W.p;\n        let svg=W.axes+L.path(L.sample(a=>p(2*Math.cos(a),Math.sin(a)),0,2*Math.PI),'curve');\n        if(s.candidate) svg+=L.line(p(-3.2,.8),p(3.2,-.8),'dashed');\n        svg+=L.line(p(...m.limits[0]),p(...m.limits[1]),'highlight');\n        // Clip the moving infinite line to this mathematical plotting rectangle.\n        const low=Math.max(-3.2,-2.2-m.t), high=Math.min(3.2,2.2-m.t);\n        if(low\u003c=high) svg+=L.line(p(low,low+m.t),p(high,high+m.t),'secondary');\n        for(const point of m.limits) svg+=open(L,p(...point));\n        if(m.valid) svg+=L.line(p(...m.endpoints[0]),p(...m.endpoints[1]),'secondary')+L.dot(p(...m.endpoints[0]),'P')+L.dot(p(...m.endpoints[1]),'Q')+L.dot(p(...m.center),'M','highlight');\n        else if(m.kind==='tangent') svg+=open(L,p(...m.center))+L.text(350,74,'相切：P、Q合一，不是弦');\n        else svg+=L.dot(p(...m.center),'消元候选点','secondary');\n        svg+=L.text(22,25,'虚线：消元整线；实线：有效中点轨迹')+L.text(22,342,m.valid?'P、Q不同，M为真实弦中点':m.kind==='tangent'?'空心端点不取：题设要求两个不同交点':'直线与椭圆相离：候选点不是弦中点');\n        return {svg:title(L,'弦中点轨迹与范围',svg),metrics:[['参数 t / √5',L.fmt(m.u)],['交点状态',m.kind==='secant'?'两个不同交点':m.kind==='tangent'?'一个相切点':'无交点'],['弦长',m.valid?L.fmt(2*m.halfChord):'不存在非退化弦'],['候选中点坐标',`(${L.fmt(m.center[0])}, ${L.fmt(m.center[1])})`]],note:'问题：消元得到一条直线，就能取整条吗？先拖到u=±1，再比较临界位置两侧。橙色开线段表示真实弦中点，虚线只是消元的候选整线。空心端点对应相切，两交点合一，不能算作非退化弦。下方“为什么成立”分别证明必要性与充分性，并解释端点为何不取。'};\n      }\n    },\n    'line-plane-minimum-angle': {\n      model(s) {\n        const theta=Number(s.theta),phi=Number(s.phi),c=theta===90?0:Math.cos(rad(theta)),z=theta===0?0:Math.sin(rad(theta));\n        const u=[c,0,z],v=[Math.cos(rad(phi)),Math.sin(rad(phi)),0];\n        const cosine=c*Math.abs(v[0]),beta=Math.acos(clamp(cosine))*180/Math.PI;\n        return {theta,phi,u,v,cosine,beta,projection:[c,0,0],projectionDefined:theta!==90,minimum:theta,allMinimum:theta===90};\n      },\n      render(s,L) {\n        const m=this.model(s),P=q=>L.project(q,Number(s.yaw),25,43,[175,210]);\n        let svg=L.polygon([[-2.5,-2.5,0],[2.5,-2.5,0],[2.5,2.5,0],[-2.5,2.5,0]].map(P),'area');\n        const mul=(a,t)=>a.map(x=>x*t);\n        svg+=L.line(P(mul(m.u,-1.3)),P(mul(m.u,3)),'curve')+L.line(P(mul(m.v,-2.6)),P(mul(m.v,2.6)),'highlight');\n        if(m.projectionDefined){svg+=L.line(P([0,0,0]),P(mul(m.projection,3)),'secondary')+L.line(P(mul(m.projection,3)),P(mul(m.u,3)),'dashed');svg+=L.text(...P(mul(m.projection,3.25)),'射影');}\n        svg+=L.dot(P([0,0,0]),'O')+L.dot(P(mul(m.u,3)),'P')+L.text(...P(mul(m.v,2.9)),'l');\n        const graph=(phi,beta)=>[395+phi/180*180,268-beta/90*155];\n        svg+=L.line(graph(0,0),graph(180,0),'axis')+L.line(graph(0,0),graph(0,90),'axis');\n        svg+=L.path(L.sample(a=>graph(a,this.model({...s,phi:a}).beta),0,180),'highlight');\n        svg+=L.line(graph(0,m.theta),graph(180,m.theta),'dashed')+L.dot(graph(m.phi,m.beta));\n        svg+=L.text(402,87,'真实夹角 β')+L.text(374,113,'90°')+L.text(380,283,'0°')+L.text(528,283,'φ=180°')+L.text(405,313,`最低值：θ=${m.theta}°`);\n        svg+=L.text(20,24,'固定空间直线，转动平面内的直线l')+L.text(20,342,m.allMinimum?'垂直边界：射影是点，所有方向都成90°':'三维投影不保角；右图与读数给出真实夹角');\n        return {svg:title(L,'线面角为何是最小夹角',svg),metrics:[['线面角 θ',`${m.theta}°`],['平面方向 φ',`${m.phi}°`],['两直线真实夹角 β',`${L.fmt(m.beta)}°`],['最小值',`${m.minimum}°`]],note:'问题：为何用射影来衡量倾斜程度？固定空间直线，只转动平面内的l，比较右侧真实夹角曲线的最低值。再把线面角调到直角，观察射影退化后为什么所有方向都成为最小值。视角只改变屏幕投影，不改变数学读数。下方“为什么成立”用单位方向向量的数量积解释最小性与等号条件。'};\n      }\n    },\n    'ssa-circle-ray': {\n      model(s) {\n        const A=Number(s.A),b=3,h=b*Math.sin(rad(A)),d=A===90?0:b*Math.cos(rad(A));\n        const radii={height:h,equal:b,below:.95*h,above:1.05*h,long:1.2*b};\n        const a=s.mode==='explore'?h*Number(s.ratio):radii[s.mode];\n        const disc=a*a-h*h,roots=[];\n        if(disc>=-1e-10){const r=Math.sqrt(Math.max(0,disc)); roots.push(d-r);if(r>1e-10)roots.push(d+r);}\n        const candidates=roots.map(c=>({c,valid:c>1e-10,point:[c,0]}));\n        const triangles=candidates.filter(q=>q.valid).map(q=>({c:q.c,point:q.point,area:q.c*h/2,B:Math.acos(clamp((q.c-d)/a))*180/Math.PI,C:180-A-Math.acos(clamp((q.c-d)/a))*180/Math.PI}));\n        return {A,b,a,h,d,center:[d,h],disc,candidates,triangles,count:triangles.length,tangent:Math.abs(disc)\u003c1e-10,mode:s.mode};\n      },\n      render(s,L) {\n        const m=this.model(s),margin=.5,xmin=Math.min(-.5,m.d-m.a)-margin,xmax=Math.max(3,m.d+m.a)+margin,ymin=Math.min(-.5,m.h-m.a)-margin,ymax=m.h+m.a+margin;\n        const W=L.world(xmin,xmax,ymin,ymax),p=W.p;\n        let svg=L.line(p(0,0),p(xmax,0),'curve')+L.line(p(xmin,0),p(0,0),'dashed');\n        svg+=L.path(L.sample(t=>p(m.d+m.a*Math.cos(t),m.h+m.a*Math.sin(t)),0,2*Math.PI),'secondary');\n        svg+=L.line(p(0,0),p(...m.center),'curve')+L.line(p(...m.center),p(m.d,0),'dashed');\n        svg+=L.dot(p(0,0),'A')+L.dot(p(...m.center),'C');\n        for(const [i,q] of m.triangles.entries()) svg+=L.polygon([p(0,0),p(...m.center),p(...q.point)],i===0?'area':'highlight')+L.dot(p(...q.point),`B${i+1}`);\n        for(const q of m.candidates.filter(q=>!q.valid)) svg+=open(L,p(...q.point));\n        svg+=L.text(20,24,'固定AC=b=3；B必须位于正向射线上')+L.text(20,342,`有效三角形：${m.count}个；负向交点与B=A均剔除`);\n        return {svg:title(L,'SSA的圆与射线：零个、一个或两个三角形',svg),metrics:[['角 A',`${m.A}°`],['半径 a=BC',L.fmt(m.a)],['到直线的高 h',L.fmt(m.h)],['有效解数',`${m.count}个`]],note:'教师拓展：不要求全体学生背完整分类。问题：同样的两边和一个对角，为何可能有两解？先看圆与整条直线的交点，再剔除反向交点和顶点重合的候选。切换精确相切预设，比较锐角、直角与钝角；切换已知两边相等预设，观察退化交点。临界预设优先于比例滑块，返回“自由探索”后滑块生效。下方“为什么成立”给出正根判定及充分性解释。'};\n      }\n    }\n  };\n  window.TEXTBOOK_EXPERIMENTS=Object.assign(window.TEXTBOOK_EXPERIMENTS||{},experiments);\n})();\n\u003c/script>\u003cscript>(() => {\n  'use strict';\n  const spec = window.LAB_SPEC, experiment = window.TEXTBOOK_EXPERIMENTS[spec.id], L = window.LabTools;\n  let state = {...spec.initial};\n  const $ = selector => document.querySelector(selector);\n  const controls = $('#controls');\n  controls.innerHTML = spec.controls.map(control => {\n    const label = L.escape(control.label), key = L.escape(control.key);\n    if (control.type === 'select') return `\u003clabel>${label}\u003cselect data-key=\"${key}\">${control.options.map(option => `\u003coption value=\"${L.escape(option.value)}\">${L.escape(option.label)}\u003c/option>`).join('')}\u003c/select>\u003c/label>`;\n    if (control.type === 'checkbox') return `\u003clabel class=\"check\">\u003cinput data-key=\"${key}\" type=\"checkbox\">${label}\u003c/label>`;\n    return `\u003clabel>${label}\u003coutput data-output=\"${key}\">\u003c/output>\u003cinput data-key=\"${key}\" type=\"range\" min=\"${control.min}\" max=\"${control.max}\" step=\"${control.step}\">\u003c/label>`;\n  }).join('');\n  function render() {\n    const result = experiment.render({...state}, L);\n    $('#diagram').innerHTML = result.svg;\n    $('#metrics').innerHTML = (result.metrics || []).map(([label, value]) => `\u003cdiv>\u003csmall>${L.escape(label)}\u003c/small>\u003cstrong>${L.escape(value)}\u003c/strong>\u003c/div>`).join('');\n    $('#note').textContent = result.note || '';\n    for (const control of spec.controls) {\n      const input = controls.querySelector(`[data-key=\"${control.key}\"]`);\n      if (control.type === 'checkbox') input.checked = state[control.key];\n      else input.value = state[control.key];\n      const output = controls.querySelector(`[data-output=\"${control.key}\"]`);\n      if (output) output.textContent = L.fmt(state[control.key], 4);\n    }\n    window.__textbookLab = {id: spec.id, state: {...state}, model: experiment.model({...state})};\n  }\n  controls.addEventListener('input', event => {\n    const input = event.target, control = spec.controls.find(item => item.key === input.dataset.key);\n    if (!control) return;\n    state[control.key] = control.type === 'checkbox' ? input.checked\n      : control.type === 'select' ? control.options.find(option => String(option.value) === input.value).value : Number(input.value);\n    render();\n  });\n  $('#reset').addEventListener('click', () => {state = {...spec.initial}; render();});\n  function validState(next) {\n    return next && typeof next === 'object' && Object.keys(next).length === spec.controls.length && spec.controls.every(c => {\n      const value = next[c.key];\n      return c.type === 'checkbox' ? typeof value === 'boolean' : c.type === 'select'\n        ? c.options.some(option => option.value === value) : Number.isFinite(value) && value >= c.min && value \u003c= c.max && Math.abs((value-c.min)/c.step-Math.round((value-c.min)/c.step)) \u003c 1e-7;\n    });\n  }\n  function restoreScene() {\n    const hash = new URLSearchParams(location.hash.slice(1)), scene = hash.get('scene'), encoded = hash.get('state');\n    if (!scene && !encoded) return;\n    state = {...spec.initial};\n    try {\n      if (scene && scene !== 'explore') throw Error('未知场景');\n      if (encoded) {\n        const overlay = JSON.parse(encoded);\n        if (!overlay || typeof overlay !== 'object' || Array.isArray(overlay) || Object.keys(overlay).some(key => !['math', 'view', 'lesson'].includes(key))) throw Error('状态分组不合法');\n        const next = {...spec.initial};\n        for (const [group, values] of Object.entries(overlay)) {\n          if (!values || typeof values !== 'object' || Array.isArray(values)) throw Error('状态分组不合法');\n          for (const [key, value] of Object.entries(values)) {\n            if (!spec.stateKeys[group].includes(key)) throw Error('未知或错组参数');\n            next[key] = value;\n          }\n        }\n        if (!validState(next)) throw Error('参数超出范围');\n        state = next;\n      }\n      render();\n    } catch (error) {\n      state = {...spec.initial}; render();\n      $('#note').textContent = error.message + '，已恢复默认探索状态。' + $('#note').textContent;\n    }\n  }\n  addEventListener('hashchange', restoreScene);\n  window.TixuPlugin = {\n    getState: () => ({...state}),\n    setState: next => {if (!validState(next)) throw Error('模块参数超出定义范围'); state = {...next}; render();},\n    pause: () => {},\n  };\n  render();\n  restoreScene();\n})();\n\u003c/script>\u003c/body>\u003c/html>"},{"id":"cube-plane-transitions","title":"深度探究 · 截面的边数为什么改变？","goal":"综合拓展：用真实平面与棱求交，解释三至六边形、临界状态与正确连线。","placements":[{"label":"必修第三册 11.1 柱体","teacher":"bx3/bx3-11-1/teacher.html#bx3-11-1-b6","student":"bx3/bx3-11-1/student.html#bx3-11-1-b6"}],"html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>深度探究 · 截面的边数为什么改变？\u003c/title>\u003cstyle>:root{--ink:#273d33;--accent:#27685c;--secondary:#346da1;--warm:#ae6036;--line:#d8ded1;--paper:#fffef8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:12px/1.6 \"PingFang SC\",\"Microsoft YaHei\",sans-serif}main{padding:10px 12px}.lab-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(180px,1fr);gap:14px}.figure{min-width:0;background:linear-gradient(140deg,#f7f9f1,#fffef8);border:1px solid var(--line);border-radius:3px;overflow:hidden}svg{display:block;width:100%;height:auto;max-height:350px}svg path,svg line{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}svg .grid{stroke:#e4e9df;stroke-width:.6}svg .axis{stroke:#9cae9e;stroke-width:1}svg .curve{stroke:var(--accent);stroke-width:2.5}svg .secondary{stroke:var(--secondary);stroke-width:2}svg .highlight{stroke:var(--warm);stroke-width:2.5}svg .aux{stroke:#829784;stroke-width:1.3}svg .dashed{stroke:#829784;stroke-width:1.3;stroke-dasharray:5 4}svg .area{fill:#d4e8dc99;stroke:var(--accent);stroke-width:1.2}svg .point{fill:var(--accent);stroke:var(--paper);stroke-width:1.3}svg text{font:12px \"PingFang SC\",sans-serif;fill:var(--ink)}svg .label{font-size:12px}svg circle.secondary{fill:var(--secondary)}svg circle.highlight{fill:var(--warm)}.formula{font-size:17px;padding:8px;background:#ecf1e6;border-left:2px solid var(--accent);overflow:auto}.formula math{max-width:100%}h3{font:600 17px/1.5 \"Songti SC\",\"STSong\",serif;margin:0 0 7px}.hint{font-size:10px;color:#6a7d68;margin:5px 8px}#metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}#metrics div{border-top:1px solid var(--line);padding:5px 0;min-width:0}small{display:block;color:#7b8875;font-size:10px}strong{font:500 14px/1.5 \"PingFang SC\",sans-serif;overflow-wrap:anywhere}#note{font-size:11px;color:#61745f;line-height:1.7}#controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}label{min-width:0;font-size:11px}label output{float:right;color:var(--accent);font-variant-numeric:tabular-nums}input[type=range]{display:block;width:100%;margin:6px 0;accent-color:var(--accent)}select{display:block;width:100%;font:11px \"PingFang SC\",sans-serif;padding:5px;background:var(--paper);border:1px solid #c5d0bf}.check{display:flex;align-items:center;gap:5px}button{font:11px \"PingFang SC\",sans-serif;padding:5px 12px;background:transparent;border:1px solid #bbcbb4;color:var(--accent);cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ae6036;outline-offset:2px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:10px;color:#788574}@media(max-width:600px){.lab-grid{grid-template-columns:1fr;gap:9px}#controls{grid-template-columns:repeat(2,minmax(0,1fr))}svg{max-height:280px}.formula{font-size:15px}#metrics{margin:7px 0}.bottom{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}\n.lab-grid>div{min-width:0}@media(max-width:600px){.lab-grid{grid-template-columns:minmax(0,1fr)}}\nmain>.formula{margin-bottom:8px}\n.lab-proof{margin-top:10px;border-top:1px solid #d8ded1;padding-top:7px}.lab-proof summary{cursor:pointer;color:#27685c;font-weight:600}.lab-proof p{margin:8px 0}.lab-proof math{max-width:100%;overflow-x:auto;padding:5px 0}\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003cdiv class=\"formula\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmi>x\u003c/mi>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmi>y\u003c/mi>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>n\u003c/mi>\u003cmn>3\u003c/mn>\u003c/msub>\u003cmi>z\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>d\u003c/mi>\u003cmo>,\u003c/mo>\u003cmspace width=\"1em\"/>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo>≤\u003c/mo>\u003cmi>x\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>y\u003c/mi>\u003cmo>,\u003c/mo>\u003cmi>z\u003c/mi>\u003cmo>≤\u003c/mo>\u003cmn>1\u003c/mn>\u003c/math>\u003c/div>\u003cdiv class=\"lab-grid\">\u003cdiv class=\"figure\">\u003csvg id=\"diagram\" viewBox=\"0 0 600 360\" role=\"img\" aria-label=\"深度探究 · 截面的边数为什么改变？\">\u003c/svg>\u003c/div>\u003cdiv>\u003cdiv id=\"metrics\" aria-live=\"polite\">\u003c/div>\u003cp id=\"note\">\u003c/p>\u003c/div>\u003c/div>\u003cdiv id=\"controls\">\u003c/div>\u003cdetails class=\"lab-proof\">\u003csummary>为什么成立 · 条件与推导\u003c/summary>\u003cdiv>\u003cp>先在左侧寻找切平面与棱的交点，再在同一个面内连接交点。右图将截面放回它自身的平面中，以等比例坐标显示，不能直接用左图投影判断角度。\u003c/p>\u003cp>设一条棱的端点为 U、V。棱上各点可写成下面形式，代入切平面方程求参数，只保留参数在闭区间内的交点。端点可能由多条棱重复给出，必须去重；整条棱位于切平面内时保留两个端点。\u003c/p>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>U\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo>(\u003c/mo>\u003cmi>V\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>U\u003c/mi>\u003cmo>)\u003c/mo>\u003cmo>,\u003c/mo>\u003cmn>0\u003c/mn>\u003cmo>≤\u003c/mo>\u003cmi>t\u003c/mi>\u003cmo>≤\u003c/mo>\u003cmn>1\u003c/mn>\u003c/math>\u003cp>切平面不与任何面重合时，它与每个面的公共部分至多是一条线段。截面的每条边位于一个面上，立方体只有六个面，因此多边形截面至多六边。若切平面与某面重合，截面直接是正方形；只接触一条棱或一个顶点，则是退化截面。\u003c/p>\u003cp>一般斜切方向取法向量 (2,3,4)，偏移量依次为6、4、2、0时，可得到三、四、五、六边形。边数变化应看交点如何经过顶点、在相邻棱之间转移，而不是只靠屏幕外观猜测。\u003c/p>\u003cp>正六边形必须同时满足等边、等角。体对角方向的中心截面满足此条件；一般斜切的中心截面不满足。面积和正多边形判断均由三维交点计算，不随观察视角改变。\u003c/p>\u003c/div>\u003c/details>\u003cdiv class=\"bottom\">\u003cspan>改变参数，观察关系；图形取样不能替代证明。\u003c/span>\u003cbutton id=\"reset\">恢复初始状态\u003c/button>\u003c/div>\u003c/main>\u003cscript>window.LAB_SPEC={\"id\":\"cube-plane-transitions\",\"title\":\"深度探究 · 截面的边数为什么改变？\",\"goal\":\"综合拓展：用真实平面与棱求交，解释三至六边形、临界状态与正确连线。\",\"summary\":\"立方体取各坐标在[-1,1]。切平面与各棱求交并去重，按截平面内的顺序连接交点，得到截面。切平面不与任何面重合时，一个面至多贡献一条截面边，因此至多六边；与某面重合时得到正方形。平面经过顶点时截线可能换边，但边数不一定改变。右侧按截平面自身的正交坐标等比例显示，避免将空间投影误认作真实形状。六边形不一定是正六边形。\",\"formula\":\"\u003cmath xmlns=\\\"http://www.w3.org/1998/Math/MathML\\\" display=\\\"block\\\">\u003cmsub>\u003cmi>n\u003c\\/mi>\u003cmn>1\u003c\\/mn>\u003c\\/msub>\u003cmi>x\u003c\\/mi>\u003cmo>+\u003c\\/mo>\u003cmsub>\u003cmi>n\u003c\\/mi>\u003cmn>2\u003c\\/mn>\u003c\\/msub>\u003cmi>y\u003c\\/mi>\u003cmo>+\u003c\\/mo>\u003cmsub>\u003cmi>n\u003c\\/mi>\u003cmn>3\u003c\\/mn>\u003c\\/msub>\u003cmi>z\u003c\\/mi>\u003cmo>=\u003c\\/mo>\u003cmi>d\u003c\\/mi>\u003cmo>,\u003c\\/mo>\u003cmspace width=\\\"1em\\\"/>\u003cmo>−\u003c\\/mo>\u003cmn>1\u003c\\/mn>\u003cmo>≤\u003c\\/mo>\u003cmi>x\u003c\\/mi>\u003cmo>,\u003c\\/mo>\u003cmi>y\u003c\\/mi>\u003cmo>,\u003c\\/mo>\u003cmi>z\u003c\\/mi>\u003cmo>≤\u003c\\/mo>\u003cmn>1\u003c\\/mn>\u003c\\/math>\",\"controls\":[{\"key\":\"direction\",\"label\":\"切平面方向（保持该方向平移）\",\"type\":\"select\",\"options\":[{\"value\":\"general\",\"label\":\"一般斜切 n=(2,3,4)\"},{\"value\":\"diagonal\",\"label\":\"体对角方向 n=(1,1,1)\"},{\"value\":\"edge\",\"label\":\"对棱方向 n=(1,1,0)\"},{\"value\":\"face\",\"label\":\"平行底面 n=(0,0,1)\"}]},{\"key\":\"offset\",\"label\":\"平面偏移 d（临界值可精确到达）\",\"type\":\"range\",\"min\":-10,\"max\":10,\"step\":0.25},{\"key\":\"yaw\",\"label\":\"观察视角（不改变截面）\",\"type\":\"range\",\"min\":0,\"max\":180,\"step\":5}],\"initial\":{\"direction\":\"general\",\"offset\":2,\"yaw\":35},\"stateKeys\":{\"math\":[\"direction\",\"offset\"],\"view\":[\"yaw\"],\"lesson\":[]}};\u003c/script>\u003cscript>(() => {\n  'use strict';\n  const escape = value => String(value).replace(/[&\u003c>\"']/g, ch => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch]));\n  const fmt = (value, digits = 3) => Number.isFinite(value) ? String(Number(value.toFixed(digits))) : '不适用';\n  const path = (points, cls = 'curve', close = false) => {\n    const valid = points.filter(point => point && point.every(Number.isFinite));\n    if (!valid.length) return '';\n    return `\u003cpath class=\"${escape(cls)}\" d=\"${valid.map((p, i) => (i ? 'L' : 'M') + p.map(n => n.toFixed(2)).join(',')).join(' ')}${close ? 'Z' : ''}\"/>`;\n  };\n  const line = (p, q, cls = 'aux') => path([p, q], cls);\n  const text = (x, y, value, cls = 'label') => `\u003ctext x=\"${fmt(x, 2)}\" y=\"${fmt(y, 2)}\" class=\"${escape(cls)}\">${escape(value)}\u003c/text>`;\n  const dot = (p, label = '', cls = 'point') => `\u003ccircle cx=\"${fmt(p[0], 2)}\" cy=\"${fmt(p[1], 2)}\" r=\"4\" class=\"${escape(cls)}\"/>` + (label ? text(p[0] + 7, p[1] - 8, label) : '');\n  function world(xmin, xmax, ymin, ymax) {\n    const scale = Math.min(516 / (xmax - xmin), 278 / (ymax - ymin));\n    const ox = 300 - (xmin + xmax) * scale / 2, oy = 180 + (ymin + ymax) * scale / 2;\n    const p = (x, y) => [ox + x * scale, oy - y * scale];\n    let axes = '';\n    const step = Math.pow(10, Math.floor(Math.log10(Math.max(xmax - xmin, ymax - ymin) / 7)));\n    const increment = Math.max(step, 1e-4);\n    let count = 0;\n    for (let x = Math.ceil(xmin / increment) * increment; x \u003c= xmax && count \u003c 90; x += increment, count++) axes += line(p(x, ymin), p(x, ymax), 'grid');\n    count = 0;\n    for (let y = Math.ceil(ymin / increment) * increment; y \u003c= ymax && count \u003c 90; y += increment, count++) axes += line(p(xmin, y), p(xmax, y), 'grid');\n    if (ymin \u003c= 0 && ymax >= 0) axes += line(p(xmin, 0), p(xmax, 0), 'axis') + text(...p(xmax, 0), 'x');\n    if (xmin \u003c= 0 && xmax >= 0) axes += line(p(0, ymin), p(0, ymax), 'axis') + text(...p(0, ymax), 'y');\n    if (xmin \u003c 0 && xmax > 0 && ymin \u003c 0 && ymax > 0) axes += text(ox - 14, oy + 17, 'O');\n    return {p, axes, scale};\n  }\n  function project(point, yaw = 35, elevation = 25, scale = 34, origin = [300, 190]) {\n    const a = yaw * Math.PI / 180, b = elevation * Math.PI / 180;\n    const horizontal = point[0] * Math.cos(a) - point[1] * Math.sin(a);\n    const depth = point[0] * Math.sin(a) + point[1] * Math.cos(a);\n    return [origin[0] + horizontal * scale, origin[1] - (point[2] * Math.cos(b) - depth * Math.sin(b)) * scale];\n  }\n  window.LabTools = {escape, fmt, path, line, text, dot, world, project,\n    polygon: (points, cls = 'area') => path(points, cls, true),\n    sample: (fn, from, to, count = 120) => Array.from({length: count + 1}, (_, i) => fn(from + (to - from) * i / count))};\n})();\n\u003c/script>\u003cscript>/* Plane/edge intersections are computed in space; the camera only projects them. */\n(() => {\n  'use strict';\n  const dot = (a,b) => a.reduce((v,x,i)=>v+x*b[i],0);\n  const sub = (a,b) => a.map((x,i)=>x-b[i]);\n  const mul = (a,t) => a.map(x=>x*t);\n  const cross = (a,b) => [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];\n  const unit = a => mul(a,1/Math.hypot(...a));\n  const vertices = Array.from({length:8},(_,i)=>[i&1?1:-1,i&2?1:-1,i&4?1:-1]);\n  const edges = vertices.flatMap((p,i)=>[1,2,4].filter(k=>!(i&k)).map(k=>[p,vertices[i|k]]));\n  const normals = {general:[2,3,4],diagonal:[1,1,1],edge:[1,1,0],face:[0,0,1]};\n  function model(s) {\n    const n=normals[s.direction],d=Number(s.offset),eps=1e-9,points=[];\n    function add(p){if(!points.some(q=>Math.hypot(...sub(p,q))\u003ceps))points.push(p);}\n    for(const [p,q] of edges){\n      const a=dot(n,p)-d,b=dot(n,q)-d;\n      if(Math.abs(a)\u003ceps)add([...p]);\n      if(Math.abs(b)\u003ceps)add([...q]);\n      if(a*b\u003c0){const t=a/(a-b);add(p.map((x,i)=>x+t*(q[i]-x)));}\n    }\n    const center=points.length?points.reduce((a,p)=>a.map((x,i)=>x+p[i]/points.length),[0,0,0]):mul(n,d/dot(n,n));\n    const u=unit(cross(n,Math.abs(n[2])\u003c.9*Math.hypot(...n)?[0,0,1]:[0,1,0])),v=unit(cross(n,u));\n    const local=p=>[dot(sub(p,center),u),dot(sub(p,center),v)];\n    points.sort((a,b)=>Math.atan2(...local(a).reverse())-Math.atan2(...local(b).reverse()));\n    const flat=points.map(local);\n    const area=Math.abs(flat.reduce((a,p,i)=>{const q=flat[(i+1)%flat.length];return a+p[0]*q[1]-p[1]*q[0];},0))/2;\n    const lengths=points.length>=3?points.map((p,i)=>Math.hypot(...sub(p,points[(i+1)%points.length]))):[];\n    const angles=points.length>=3?points.map((p,i)=>{\n      const a=sub(points[(i+points.length-1)%points.length],p),b=sub(points[(i+1)%points.length],p);\n      return Math.acos(Math.max(-1,Math.min(1,dot(a,b)/Math.hypot(...a)/Math.hypot(...b))));\n    }):[];\n    const regular=lengths.length>=3&&Math.max(...lengths)-Math.min(...lengths)\u003ceps&&Math.max(...angles)-Math.min(...angles)\u003ceps;\n    const type=points.length\u003c3?['空集','一个顶点','一条棱或线段'][points.length]:`${points.length}边形`;\n    return {normal:n,offset:d,points,flat,area,lengths,angles,regular,type,center};\n  }\n  function render(s,L){\n    const m=model(s),P=p=>L.project(p,Number(s.yaw),25,71,[168,180]);\n    const Q=p=>[445+59*p[0],180-59*p[1]];\n    let svg=L.text(27,29,'空间求交：只连接同一面上的截线')+L.text(358,29,'截面正视图（等比例）');\n    svg+=edges.map(([p,q])=>L.line(P(p),P(q),'aux')).join('');\n    if(m.points.length>=3)svg+=L.polygon(m.points.map(P),'area')+L.path(m.points.map(P),'highlight',true)+L.polygon(m.flat.map(Q),'area')+L.path(m.flat.map(Q),'highlight',true);\n    if(m.points.length===2)svg+=L.line(...m.points.map(P),'highlight')+L.line(...m.flat.map(Q),'highlight');\n    m.points.forEach((p,i)=>{svg+=L.dot(P(p),String(i+1))+L.dot(Q(m.flat[i]),String(i+1));});\n    if(!m.points.length)svg+=L.text(385,180,'切平面未接触立方体');\n    svg+=L.text(27,321,'左图仅为投影，屏幕角度不是空间角度')+L.text(27,343,'临界位置：平面经过顶点 / 包含棱 / 与面重合');\n    const counts=m.normal.join(' : ');\n    return {svg,metrics:[['截面类型',m.type],['真实截面积',L.fmt(m.area,4)],['法向量分量',counts],['是否正多边形',m.points.length>=3?(m.regular?'是':'否'):'不适用']],\n      note:'先选“一般斜切”，将偏移量依次设为6、4、2、0，观察三、四、五、六边形。沿每个面连接交点，才能得到真实截线。切平面不与任何面重合时，每个面至多贡献一条截面边，故至多六边；与某面重合时直接得到正方形。过顶点时可能换边，不一定改变边数。体对角方向、偏移0得到正六边形；一般斜切、偏移0虽也是六边形，却不是正六边形。切到一个顶点或一条棱时不再是多边形截面。旋转视角不改变求交与面积。'};\n  }\n  window.TEXTBOOK_EXPERIMENTS=Object.assign(window.TEXTBOOK_EXPERIMENTS||{}, {'cube-plane-transitions':{model,render}});\n})();\n\u003c/script>\u003cscript>(() => {\n  'use strict';\n  const spec = window.LAB_SPEC, experiment = window.TEXTBOOK_EXPERIMENTS[spec.id], L = window.LabTools;\n  let state = {...spec.initial};\n  const $ = selector => document.querySelector(selector);\n  const controls = $('#controls');\n  controls.innerHTML = spec.controls.map(control => {\n    const label = L.escape(control.label), key = L.escape(control.key);\n    if (control.type === 'select') return `\u003clabel>${label}\u003cselect data-key=\"${key}\">${control.options.map(option => `\u003coption value=\"${L.escape(option.value)}\">${L.escape(option.label)}\u003c/option>`).join('')}\u003c/select>\u003c/label>`;\n    if (control.type === 'checkbox') return `\u003clabel class=\"check\">\u003cinput data-key=\"${key}\" type=\"checkbox\">${label}\u003c/label>`;\n    return `\u003clabel>${label}\u003coutput data-output=\"${key}\">\u003c/output>\u003cinput data-key=\"${key}\" type=\"range\" min=\"${control.min}\" max=\"${control.max}\" step=\"${control.step}\">\u003c/label>`;\n  }).join('');\n  function render() {\n    const result = experiment.render({...state}, L);\n    $('#diagram').innerHTML = result.svg;\n    $('#metrics').innerHTML = (result.metrics || []).map(([label, value]) => `\u003cdiv>\u003csmall>${L.escape(label)}\u003c/small>\u003cstrong>${L.escape(value)}\u003c/strong>\u003c/div>`).join('');\n    $('#note').textContent = result.note || '';\n    for (const control of spec.controls) {\n      const input = controls.querySelector(`[data-key=\"${control.key}\"]`);\n      if (control.type === 'checkbox') input.checked = state[control.key];\n      else input.value = state[control.key];\n      const output = controls.querySelector(`[data-output=\"${control.key}\"]`);\n      if (output) output.textContent = L.fmt(state[control.key], 4);\n    }\n    window.__textbookLab = {id: spec.id, state: {...state}, model: experiment.model({...state})};\n  }\n  controls.addEventListener('input', event => {\n    const input = event.target, control = spec.controls.find(item => item.key === input.dataset.key);\n    if (!control) return;\n    state[control.key] = control.type === 'checkbox' ? input.checked\n      : control.type === 'select' ? control.options.find(option => String(option.value) === input.value).value : Number(input.value);\n    render();\n  });\n  $('#reset').addEventListener('click', () => {state = {...spec.initial}; render();});\n  function validState(next) {\n    return next && typeof next === 'object' && Object.keys(next).length === spec.controls.length && spec.controls.every(c => {\n      const value = next[c.key];\n      return c.type === 'checkbox' ? typeof value === 'boolean' : c.type === 'select'\n        ? c.options.some(option => option.value === value) : Number.isFinite(value) && value >= c.min && value \u003c= c.max && Math.abs((value-c.min)/c.step-Math.round((value-c.min)/c.step)) \u003c 1e-7;\n    });\n  }\n  function restoreScene() {\n    const hash = new URLSearchParams(location.hash.slice(1)), scene = hash.get('scene'), encoded = hash.get('state');\n    if (!scene && !encoded) return;\n    state = {...spec.initial};\n    try {\n      if (scene && scene !== 'explore') throw Error('未知场景');\n      if (encoded) {\n        const overlay = JSON.parse(encoded);\n        if (!overlay || typeof overlay !== 'object' || Array.isArray(overlay) || Object.keys(overlay).some(key => !['math', 'view', 'lesson'].includes(key))) throw Error('状态分组不合法');\n        const next = {...spec.initial};\n        for (const [group, values] of Object.entries(overlay)) {\n          if (!values || typeof values !== 'object' || Array.isArray(values)) throw Error('状态分组不合法');\n          for (const [key, value] of Object.entries(values)) {\n            if (!spec.stateKeys[group].includes(key)) throw Error('未知或错组参数');\n            next[key] = value;\n          }\n        }\n        if (!validState(next)) throw Error('参数超出范围');\n        state = next;\n      }\n      render();\n    } catch (error) {\n      state = {...spec.initial}; render();\n      $('#note').textContent = error.message + '，已恢复默认探索状态。' + $('#note').textContent;\n    }\n  }\n  addEventListener('hashchange', restoreScene);\n  window.TixuPlugin = {\n    getState: () => ({...state}),\n    setState: next => {if (!validState(next)) throw Error('模块参数超出定义范围'); state = {...next}; render();},\n    pause: () => {},\n  };\n  render();\n  restoreScene();\n})();\n\u003c/script>\u003c/body>\u003c/html>"}], frame=document.querySelector('#experiment');let current;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function select(index){const item=items[index];current=item.id;document.querySelector('#title').textContent=item.title;document.querySelector('#goal').textContent=item.goal;document.querySelectorAll('[data-index]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.index===index)));document.querySelector('#chapter-links').innerHTML=item.placements.map(p=>`<div><span>${esc(p.label)}</span><a href="${esc(p.teacher)}">进入教师版</a><a href="${esc(p.student)}">进入学生版</a></div>`).join('');const bridge='<script>(()=>{const report=()=>parent.postMessage({channel:"deep-gallery",id:'+JSON.stringify(item.id)+',height:Math.ceil(document.querySelector("main").getBoundingClientRect().height)+8},"*");new ResizeObserver(report).observe(document.querySelector("main"));addEventListener("load",report);report();})();<'+ '/script>';frame.title=item.title;frame.style.height='630px';frame.srcdoc=item.html.replace('</body>',bridge+'</body>');history.replaceState(null,'','#'+item.id)}
addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.data?.channel==='deep-gallery'&&event.data.id===current&&Number.isFinite(event.data.height)){frame.style.height=Math.max(200,Math.min(4000,event.data.height))+'px'}});
document.querySelectorAll('[data-index]').forEach(b=>b.addEventListener('click',()=>select(+b.dataset.index)));select(Math.max(0,items.findIndex(a=>a.id===location.hash.slice(1))));
