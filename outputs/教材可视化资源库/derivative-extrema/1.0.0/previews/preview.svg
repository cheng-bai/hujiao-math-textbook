<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360"><style>:root{--ink:#273d33;--accent:#27685c;--secondary:#346da1;--warm:#ae6036;--line:#d8ded1;--paper:#fffef8}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:12px/1.6 "PingFang SC","Microsoft YaHei",sans-serif}main{padding:10px 12px}.lab-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(180px,1fr);gap:14px}.figure{min-width:0;background:linear-gradient(140deg,#f7f9f1,#fffef8);border:1px solid var(--line);border-radius:3px;overflow:hidden}svg{display:block;width:100%;height:auto;max-height:350px}svg path,svg line{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}svg .grid{stroke:#e4e9df;stroke-width:.6}svg .axis{stroke:#9cae9e;stroke-width:1}svg .curve{stroke:var(--accent);stroke-width:2.5}svg .secondary{stroke:var(--secondary);stroke-width:2}svg .highlight{stroke:var(--warm);stroke-width:2.5}svg .aux{stroke:#829784;stroke-width:1.3}svg .dashed{stroke:#829784;stroke-width:1.3;stroke-dasharray:5 4}svg .area{fill:#d4e8dc99;stroke:var(--accent);stroke-width:1.2}svg .point{fill:var(--accent);stroke:var(--paper);stroke-width:1.3}svg text{font:12px "PingFang SC",sans-serif;fill:var(--ink)}svg .label{font-size:12px}svg circle.secondary{fill:var(--secondary)}svg circle.highlight{fill:var(--warm)}.formula{font-size:17px;padding:8px;background:#ecf1e6;border-left:2px solid var(--accent);overflow:auto}.formula math{max-width:100%}h3{font:600 17px/1.5 "Songti SC","STSong",serif;margin:0 0 7px}.hint{font-size:10px;color:#6a7d68;margin:5px 8px}#metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}#metrics div{border-top:1px solid var(--line);padding:5px 0;min-width:0}small{display:block;color:#7b8875;font-size:10px}strong{font:500 14px/1.5 "PingFang SC",sans-serif;overflow-wrap:anywhere}#note{font-size:11px;color:#61745f;line-height:1.7}#controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;marg