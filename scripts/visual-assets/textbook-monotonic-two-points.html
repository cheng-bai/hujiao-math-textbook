n><\/msub><mo>+<\/mo><msub><mi>x<\/mi><mn>1<\/mn><\/msub><mo>)<\/mo><\/mrow><\/math>","controls":[{"key":"kind","label":"函数模型","type":"select","options":[{"value":"square","label":"平方函数"},{"value":"cube","label":"三次函数 / 3"},{"value":"decreasing","label":"y=-x"},{"value":"constant","label":"常函数 y=1"}]},{"key":"left","label":"左点 x₁","type":"range","min":-2,"max":1,"step":0.1},{"key":"gap","label":"横坐标差 x₂-x₁","type":"range","min":0.1,"max":1,"step":0.1}],"initial":{"kind":"square","left":-0.5,"gap":1},"stateKeys":{"math":["kind","left","gap"],"view":[],"lesson":[]}};</script><script>(() => {
  'use strict';
  const escape = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

  const path = (points, cls = 'curve', close = false) => {
    const valid = points.filter(point => point && point.every(Number.isFinite));
    if (!valid.length) return '';
    return `<path class="${escape(cls)}" d="${valid.map((p, i) => (i ? 'L' : 'M') + p.map(n => n.toFixed(2)).join(',')).join(' ')}${close ? 'Z' : ''}"/>`;
  };
  const line = (p, q, cls = 'aux') => path([p, q], cls);
  const text = (x, y, value, cls = 'label') => `<text x="${fmt(x, 2)}" y="${fmt(y, 2)}" class="${escape(cls)}">${escape(value)}</text>`;
  const dot = (p, label = '', cls = 'point') => `<circle cx="${fmt(p[0], 2)}" cy="${fmt(p[1], 2)}" r="4" class="${escape(cls)}"/>` + (label ? text(p[0] + 7, p[1] - 8, label) : '');
  function world(xmin, xmax, ymin, ymax) {
    const scale = Math.min(516 / (xmax - xmin), 278 / (ymax - ymin));
    const ox = 300 - (xmin + xmax) * scale / 2, oy = 180 + (ymin + ymax) * scale / 2;
    const p = (x, y) => [ox + x * scale, oy - y * scale];
    let axes = '';
    const step = Math.pow(10, Math.floor(Math.log10(Math.max(xmax - xmin, ymax - ymin) / 7)));
    const increment = Math.max(step, 1e-4);
    let count = 0;
    for (let x = Math.ceil(xmin / increment) * increment; x <= xmax && count < 90; x += increment, count++) axes += line(p(x, ymin), p(x, ymax), 'grid');
    count = 0;
    for (let y = Math.ceil(ymin / increment) * increment; y <= ymax && count < 90; y += increment, count++) axes += line(p(xmin, y), p(xmax, y), 'grid');
    if (ymin <= 0 && ymax >= 0) axes += line(p(xmin, 0), p(xmax, 0), 'axis') + text(...p(xmax, 0), 'x');
    if (xmin <= 0 && xmax >= 0) axes += line(p(0, ymin), p(0, ymax), 'axis') + text(...p(0, ymax), 'y');

})();

    render(s,L) {const m=this.model(s),w=L.world(-4,7.3,-2.8,2.8),cx=-2.3;const pp=w.p(cx+m.x,m.y),q=w.p(m.theta,m.y);return {svg:w.axes+circle(L,w,cx,0,1)+L.line(w.p(cx,0),pp,'secondary')+L.line(pp,q,'dashed')+graph(L,w,Math.sin,0,tau,'aux')+graph(L,w,Math.sin,0,m.theta,'curve')+[0,Math.PI/2,Math.PI,3*Math.PI/2,tau].map(a=>L.dot(w.p(a,Math.sin(a)),'','point')).join('')+L.dot(pp,'P')+L.dot(q,'M')+L.text(35,35,'同一高度：圆上纵坐标 → 曲线上函数值'),metrics:[['横坐标 / 弧度（近似）',L.fmt(m.theta)],['纵坐标 sin（近似）',L.fmt(m.y)],['一周', '2π 弧度']],note:'曲线横坐标是弧度数，而不是圆上点的横坐标。五个关键点依次为 (0,0)、(π/2,1)、(π,0)、(3π/2,-1)、(2π,0)；连续取角得到光滑曲线，再平移整周期扩展。控制器角度用度显示，模型先转换为弧度。'};}

  E['sine-transform'] = {
    model(s) {const A=Number(s.amplitude),omega=Number(s.omega),phi=rad(s.phase),x=Number(s.x);return {A,omega,phi,x,y:A*Math.sin(omega*x+phi),period:tau/omega,shift:-phi/omega,frequency:omega/tau};},
    render(s,L) {const m=this.model(s),w=L.world(-6.6,6.6,-4,4);return {svg:w.axes+graph(L,w,Math.sin,-6.3,6.3,'aux')+graph(L,w,x=>m.A*Math.sin(m.omega*x+m.phi),-6.3,6.3)+L.line(w.p(-6.3,m.A),w.p(6.3,m.A),'dashed')+L.line(w.p(-6.3,-m.A),w.p(6.3,-m.A),'dashed')+L.dot(w.p(m.x,m.y),'P'),metrics:[['振幅 A',L.fmt(m.A)],['周期 T（近似）',L.fmt(m.period)],['频率 f（近似）',L.fmt(m.frequency)],['水平位移 -φ/ω（近似）',L.fmt(m.shift)],['当前函数值（近似）',L.fmt(m.y)]],note:'灰线为 y=sin x，实线为改变后的函数，虚线为上下振幅界。A>0、ω>0；相位为 ωx+φ，初相为 φ。改变 ω 时周期与水平位移都会变化，不可把 φ 直接当作横移量。负 A 或负 ω 可用诱导公式化归；时钟顺时针转动的原情境详见保留原文。'};}
  };
  E['tangent-branches'] = {
    model(s) {const theta=rad(s.angle),cos=Math.cos(theta);return {theta,defined:Math.abs(cos)>1e-12,value:Math.abs(cos)>1e-12?Math.sin(theta)/cos:null};},
    render(s,L) {const m=this.model(s),w=L.world(-5.2,5.2,-3.2,3.2);let svg=w.axes;
      for(let k=-1;k<=1;k++){const c=k*Math.PI;svg+=graph(L,w,Math.tan,c-Math.atan(3),c+Math.atan(3));}
      for(const x of [-1.5*Math.PI,-.5*Math.PI,.5*Math.PI,1.5*Math.PI])svg+=L.line(w.p(x,-3),w.p(x,3),'dashed');
      if(m.defined&&Math.abs(m.value)<=3)svg+=L.dot(w.p(m.theta,m.value),'P');
      return {svg,metrics:[['x / 弧度（近似）',L.fmt(m.theta)],['tan x（近似）',m.defined?L.fmt(m.value):'未定义'],['显示状态',!m.defined?'渐近线处无点':Math.abs(m.value)>3?'点超出纵向视窗':'点在视窗内']],note:'虚线为 x=π/2+kπ，不是函数图像。每一支仅在自己的区间内严格增，相邻支相隔 π；不同分支不能连线。读数可趋向很大，但渐近线处没有无穷大的函数值。图中曲线只绘出纵坐标在 [-3,3] 内的部分。'};}
  };
  E['dot-projection'] = {
    model(s) {const a=Number(s.a),b=Number(s.b),theta=rad(s.angle),bx=b*Math.cos(theta),by=b*Math.sin(theta);return {a,b,theta,bx,by,dot:a*bx,projection:[bx,0],length:Math.abs(bx)};},
    render(s,L) {const m=this.model(s),w=L.world(-5.2,5.2,-1,5.3),o=w.p(0,0),B=w.p(m.bx,m.by);return {svg:w.axes+L.line(o,w.p(m.a,0),'curve')+L.line(o,B,'secondary')+L.line(B,w.p(m.bx,0),'dashed')+L.line(o,w.p(m.bx,0),'highlight')+L.dot(w.p(m.a,0),'A')+L.dot(B,'B')+L.dot(w.p(m.bx,0),'B′')+L.text(35,35,'a 沿 x 正方向；高亮线是 b 的投影向量'),metrics:[['数量投影（近似，可为负）',L.fmt(m.bx)],['投影向量长度（近似）',L.fmt(m.length)],['a·b（近似）',L.fmt(m.dot)],['夹角',m.b===0?'零向量：未定义':String(s.angle)+'°']],note:'方向向量 a 非零。锐角时投影同向、钝角时反向、直角时为零；数量投影是带符号的数，其绝对值才是投影向量的模。b=0 时投影和数量积均为零，不给零向量定义夹角。'};}
  };
  E['complex-transform'] = {
    model(s) {const r=Number(s.r),scale=Number(s.scale),alpha=rad(s.alpha),beta=rad(s.beta),divide=s.operation==='divide',factor=divide?1/scale:scale,angle=divide?alpha-beta:alpha+beta;return {r,scale,alpha,beta,divide,factor,angle,z:[r*Math.cos(alpha),r*Math.sin(alpha)],w:[scale*Math.cos(beta),scale*Math.sin(beta)],result:[r*factor*Math.cos(angle),r*factor*Math.sin(angle)],modulus:r*factor};},
    render(s,L) {const m=this.model(s),w=L.world(-5.2,5.2,-5.2,5.2),o=w.p(0,0);return {svg:w.axes+circle(L,w,0,0,m.r,'aux')+circle(L,w,0,0,m.modulus,'dashed')+L.line(o,w.p(...m.z),'secondary')+L.line(o,w.p(...m.w),'aux')+L.line(o,w.p(...m.result),'curve')+L.dot(w.p(...m.z),'z')+L.dot(w.p(...m.w),'w')+L.dot(w.p(...m.result),m.divide?'z/w':'zw'),metrics:[['模的变化（近似）',L.fmt(m.r)+' → '+L.fmt(m.modulus)],['旋转角',String(m.divide?-Number(s.beta):Number(s.beta))+'°'],['结果坐标（近似）',m.result.map(v=>L.fmt(v)).join(', ')]],note:'乘以非零 w：模乘 |w|、辐角加 arg(w)；除以 w：模除 |w|、辐角减 arg(w)。辐角只在模 2π 的意义下确定，零复数不定义辐角。模型允许 z=0，此时原点不动；除数模始终严格正。公式由两角和公式展开得到，不以图形采样代替证明。'};}
  };
  window.TEXTBOOK_EXPERIMENTS=Object.assign(window.TEXTBOOK_EXPERIMENTS||{},E);
}());
</script><script>(() => {
  'use strict';
  const spec = window.LAB_SPEC, experiment = window.TEXTBOOK_EXPERIMENTS[spec.id], L = window.LabTools;
  let state = {...spec.initial};
  const $ = selector => document.querySelector(selector);
  const controls = $('#controls');
  controls.innerHTML = spec.controls.map(control => {
    const label = L.escape(control.label), key = L.escape(control.key);
    if (control.type === 'select') return `<label>${label}<select data-key="${key}">${control.options.map(option => `<option value="${L.escape(option.value)}">${L.escape(option.label)}</option>`).join('')}</select></label>`;
    if (control.type === 'checkbox') return `<label class="check"><input data-key="${key}" type="checkbox">${label}</label>`;
    return `<label>${label}<output data-output="${key}"></output><input data-key="${key}" type="range" min="${control.min}" max="${control.max}" step="${control.step}"></label>`;
  }).join('');
  function render() {
    const result = experiment.render({...state}, L);
    $('#diagram').innerHTML = result.svg;
    $('#metrics').innerHTML = (result.metrics || []).map(([label, value]) => `<div><small>${L.escape(label)}</small><strong>${L.escape(value)}</strong></div>`).join('');
    $('#note').textContent = result.note || '';
    for (const control of spec.controls) {
      const input = controls.querySelector(`[data-key="${control.key}"]`);
      if (control.type === 'checkbox') input.checked = state[control.key];
      else input.value = state[control.key];
      const output = controls.querySelector(`[data-output="${control.key}"]`);
      if (output) output.textContent = L.fmt(state[control.key], 4);
    }
    window.__textbookLab = {id: spec.id, state: {...state}, model: experiment.model({...state})};
  }
  controls.addEventListener('input', event => {
    const input = event.target, control = spec.controls.find(item => item.key === input.dataset.key);
    if (!control) return;
    state[control.key] = control.type === 'checkbox' ? input.checked
      : control.type === 'select' ? control.options.find(option => String(option.value) === input.value).value : Number(input.value);
    render();
  });
  $('#reset').addEventListener('click', () => {state = {...spec.initial}; render();});
  function validState(next) {
    return next && typeof next === 'object' && Object.keys(next).length === spec.controls.length && spec.controls.every(c => {
      const value = next[c.key];
      return c.type === 'checkbox' ? typeof value === 'boolean' : c.type === 'select'
        ? c.options.some(option => option.value === value) : Number.isFinite(value) && value >= c.min && value <= c.max && Math.abs((value-c.min)/c.step-Math.round((value-c.min)/c.step)) < 1e-7;
    });
  }
  function restoreScene() {
    const hash = new URLSearchParams(location.hash.slice(1)), scene = hash.get('scene'), encoded = hash.get('state');
    if (!scene && !encoded) return;
    state = {...spec.initial};
    try {
      if (scene && scene !== 'explore') throw Error('未知场景');
      if (encoded) {
        const overlay = JSON.parse(encoded);
        if (!overlay || typeof overlay !== 'object' || Array.isArray(overlay) || Object.keys(overlay).some(key => !['math', 'view', 'lesson'].includes(key))) throw Error('状态分组不合法');
        const next = {...spec.initial};
        for (const [group, values] of Object.entries(overlay)) {
          if (!values || typeof values !== 'object' || Array.isArray(values)) throw Error('状态分组不合法');
          for (const [key, value] of Object.entries(values)) {
            if (!spec.stateKeys[group].includes(key)) throw Error('未知或错组参数');
            next[key] = value;
          }
        }
        if (!validState(next)) throw Error('参数超出范围');
        state = next;
      }
      render();
    } catch (error) {
      state = {...spec.initial}; render();
      $('#note').textContent = error.message + '，已恢复默认探索状态。' + $('#note').textContent;
    }
  }
  addEventListener('hashchange', restoreScene);
  window.TixuPlugin = {
    getState: () => ({...state}),
    setState: next => {if (!validState(next)) throw Error('模块参数超出定义范围'); state = {...next}; render();},
    pause: () => {},
  };
  render();
  restoreScene();
})();
</script></body></html>
